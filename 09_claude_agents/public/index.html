<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>first-agent</title>
<style>
  :root {
    --bg: #f6f6f4;
    --panel: #ffffff;
    --ink: #1d1d1b;
    --muted: #7a7a72;
    --line: #e3e3dd;
    --user: #1d1d1b;
    --user-ink: #ffffff;
    --agent: #efefea;
    --accent: #b8552f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --panel: #1d1d22;
      --ink: #ececea;
      --muted: #8f8f96;
      --line: #2c2c33;
      --user: #ececea;
      --user-ink: #16161a;
      --agent: #26262d;
      --accent: #e08b63;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  .shell {
    width: 100%;
    max-width: 1000px;
    display: flex;
    height: 100vh;
    background: var(--panel);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }

  .app {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .sidebar {
    width: 260px;
    flex: none;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
    background: var(--bg);
  }
  .sidebar h2 {
    margin: 0;
    padding: 20px 16px 12px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  #conversations {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 16px;
  }
  .conversation {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .conversation:hover { background: var(--agent); }
  .conversation.active { background: var(--agent); }
  .conversation.active .title { font-weight: 600; }
  .conversation .text { flex: 1; min-width: 0; }
  .conversation .title {
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .conversation .when { font-size: 12px; color: var(--muted); }
  .conversation .remove {
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 2px 6px;
    line-height: 1;
    font-size: 15px;
    opacity: 0;
  }
  .conversation:hover .remove,
  .conversation .remove:focus { opacity: 1; }
  .conversation .remove:hover { color: var(--accent); }
  .sidebar .empty { padding: 0 10px; font-size: 13px; color: var(--muted); }

  @media (max-width: 720px) {
    .shell { flex-direction: column; height: auto; min-height: 100vh; }
    .sidebar {
      width: 100%;
      border-right: none;
      border-bottom: 1px solid var(--line);
      max-height: 40vh;
    }
    .app { min-height: 60vh; }
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 13px; margin-right: auto; }

  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    padding: 6px 12px;
    font-size: 13px;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: 0.45; cursor: default; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .row { display: flex; flex-direction: column; max-width: 82%; }
  .row.user { align-self: flex-end; align-items: flex-end; }
  .row.agent { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .user .bubble {
    background: var(--user);
    color: var(--user-ink);
    border-bottom-right-radius: 4px;
  }
  .agent .bubble {
    background: var(--agent);
    border-bottom-left-radius: 4px;
  }
  .agent.error .bubble {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
  }

  .meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 5px;
    padding: 0 4px;
  }

  .empty {
    margin: auto;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
  }

  .dots span {
    display: inline-block;
    animation: blink 1.2s infinite both;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  form {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    padding: 16px 24px 20px;
    border-top: 1px solid var(--line);
  }

  textarea {
    flex: 1;
    resize: none;
    font: inherit;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    max-height: 180px;
  }
  textarea:focus { outline: 2px solid var(--muted); outline-offset: -1px; }

  #send {
    background: var(--user);
    color: var(--user-ink);
    border-color: var(--user);
    padding: 10px 18px;
    font-size: 14px;
  }

  /* ---- usage strip ------------------------------------------------------ */

  .usage {
    display: flex;
    gap: 0;
    padding: 10px 24px;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    background: var(--bg);
  }
  .stat {
    flex: none;
    padding: 0 18px 0 0;
    margin-right: 18px;
    border-right: 1px solid var(--line);
    white-space: nowrap;
  }
  .stat:last-child { border-right: none; margin-right: 0; padding-right: 0; }
  .stat .label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
  }
  .stat .value { font-size: 15px; font-variant-numeric: tabular-nums; }
  .stat .value .unit { font-size: 12px; color: var(--muted); }

  /* ---- cost chart ------------------------------------------------------- */

  .chart {
    border-bottom: 1px solid var(--line);
    padding: 10px 24px 12px;
  }
  .chart > summary {
    cursor: pointer;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    list-style: none;
  }
  .chart > summary::before { content: "▾ "; }
  .chart:not([open]) > summary::before { content: "▸ "; }
  .chart svg { display: block; width: 100%; height: 120px; margin-top: 8px; }
  .chart .note {
    font-size: 12px;
    color: var(--muted);
    margin: 6px 0 0;
    line-height: 1.5;
  }

  /* ---- context-window banner -------------------------------------------- */

  .window-banner {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    flex-wrap: wrap;
    padding: 12px 24px;
    border-top: 1px solid var(--line);
    background: var(--bg);
    font-size: 13px;
    line-height: 1.5;
  }
  .window-banner .text { flex: 1; min-width: 260px; color: var(--muted); }
  .window-banner .text strong { color: var(--ink); }
  .window-banner .text .dropped { color: var(--accent); font-weight: 600; }
  .window-banner .controls { display: flex; gap: 14px; align-items: center; }
  .window-banner label {
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
  }
  .window-banner input,
  .window-banner select {
    font: inherit;
    font-size: 13px;
    width: 84px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 5px 8px;
  }

  /* ---- the boundary in the transcript ----------------------------------- */

  .boundary {
    align-self: stretch;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--accent);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }
  .boundary::before,
  .boundary::after {
    content: "";
    flex: 1;
    border-top: 1px dashed var(--accent);
  }

  .row.outside .bubble { opacity: 0.45; }

  .warning {
    margin-top: 6px;
    padding: 8px 12px;
    border: 1px solid var(--accent);
    border-radius: 10px;
    color: var(--accent);
    font-size: 12px;
    line-height: 1.5;
    max-width: 100%;
  }
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
  <h2>Conversations</h2>
  <div id="conversations"></div>
</aside>

<div class="app">
  <header>
    <h1>first-agent</h1>
    <span class="sub">a small chat agent</span>
    <button id="new-conversation" type="button">New conversation</button>
  </header>

  <div class="usage" id="usage"></div>

  <details class="chart" id="chart-panel" open>
    <summary>Cost growth</summary>
    <svg id="chart" viewBox="0 0 600 140" preserveAspectRatio="none" role="img"
         aria-label="Cumulative cost by turn"></svg>
    <p class="note" id="chart-note"></p>
  </details>

  <div id="messages" aria-live="polite"></div>

  <div class="window-banner">
    <p class="text" id="window-text"></p>
    <div class="controls">
      <label>User msgs
        <input id="context-messages" type="number" min="1" max="100" step="1" value="5">
      </label>
      <label>Max tokens
        <select id="max-tokens">
          <option value="30">30</option>
          <option value="300">300</option>
          <option value="1024" selected>1024</option>
        </select>
      </label>
    </div>
  </div>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="Say something… (Enter to send, Shift+Enter for a newline)" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>
</div>

<script type="module">
  // The formatters and the price table come from the server's own module, so a
  // number in the UI is formatted by exactly the code that priced it.
  import { formatCost, formatTokens, pricingFor } from "/pricing.js";

  const SESSION_KEY = "first-agent.sessionId";
  // What the "% of the window" figure is measured against. The real number
  // comes from the model that actually answered; 200K is the stand-in until
  // one has.
  const DEFAULT_CONTEXT_WINDOW = 200000;

  // The id lives in localStorage, not in a page variable: a fresh random id on
  // every load would look like amnesia even with the server persisting fine.
  let sessionId = localStorage.getItem(SESSION_KEY);
  if (!sessionId) {
    sessionId = crypto.randomUUID();
    localStorage.setItem(SESSION_KEY, sessionId);
  }

  const messages = document.getElementById("messages");
  const conversations = document.getElementById("conversations");
  const form = document.getElementById("composer");
  const input = document.getElementById("input");
  const sendButton = document.getElementById("send");
  const newButton = document.getElementById("new-conversation");
  const usageStrip = document.getElementById("usage");
  const chart = document.getElementById("chart");
  const chartNote = document.getElementById("chart-note");
  const windowText = document.getElementById("window-text");
  const contextInput = document.getElementById("context-messages");
  const maxTokensSelect = document.getElementById("max-tokens");

  let pending = false;
  // What the last turn told us about the window. The banner has to say
  // something before the first turn, so it starts from the control's value.
  let windowState = { contextMessages: Number(contextInput.value), droppedCount: 0, storedMessages: 0 };
  let lastSentTokens = null;
  let lastModel = null;

  function showEmptyState() {
    messages.innerHTML = '<p class="empty">No messages yet — say hello.</p>';
  }

  function clearEmptyState() {
    messages.querySelector(".empty")?.remove();
  }

  /** `claude-haiku-4-5-20251001` → `haiku-4.5`. The date is noise in a counter. */
  function shortModel(model) {
    if (!model) return "";
    const match = /^claude-([a-z]+)-(\d+)-(\d+)/.exec(model);
    return match ? `${match[1]}-${match[2]}.${match[3]}` : model;
  }

  /**
   * The line under a reply: real billed tokens, what they cost, how long it
   * took, and which model said it.
   */
  function agentMetaLine({ tokens, cost, model, ms }) {
    const parts = [];
    if (tokens?.input != null) parts.push(formatTokens(tokens.input) + " in");
    if (tokens?.output != null) parts.push(formatTokens(tokens.output) + " out");
    if (cost?.total != null) parts.push(formatCost(cost.total));
    if (ms != null) parts.push((ms / 1000).toFixed(1) + "s");
    if (model) parts.push(shortModel(model));
    return parts.join(" · ");
  }

  function addMessage(who, text, { meta = null, error = false } = {}) {
    clearEmptyState();
    const row = document.createElement("div");
    row.className = "row " + who + (error ? " error" : "");

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);

    if (meta?.truncated) row.appendChild(truncationWarning(meta));

    const line = document.createElement("div");
    line.className = "meta";
    line.textContent = meta
      ? who === "user"
        ? userMetaLine(meta)
        : agentMetaLine(meta)
      : "";
    if (!error) row.appendChild(line);

    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return row;
  }

  function userMetaLine(meta) {
    const count = meta.tokens?.request;
    return count == null ? "" : formatTokens(count) + " tokens";
  }

  function truncationWarning() {
    const box = document.createElement("div");
    box.className = "warning";
    box.textContent =
      "Cut off: the reply hit the max_tokens ceiling and stopped mid-sentence. " +
      "It was still saved to history exactly as it arrived, so on the next turn " +
      "the model will read its own unfinished sentence as something it meant to say.";
    return box;
  }

  function addThinking() {
    clearEmptyState();
    const row = document.createElement("div");
    row.className = "row agent";
    row.innerHTML =
      '<div class="bubble">thinking<span class="dots">' +
      "<span>.</span><span>.</span><span>.</span></span></div>";
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return row;
  }

  function setPending(value) {
    pending = value;
    sendButton.disabled = value;
    newButton.disabled = value;
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
  }

  // ---- the context window --------------------------------------------------

  /**
   * Draw the line between what the model can still see and what it cannot.
   * The messages above it are on disk and in the transcript, and are simply
   * not being sent any more.
   */
  function markContextBoundary(droppedCount) {
    messages.querySelector(".boundary")?.remove();
    for (const row of messages.querySelectorAll(".row.outside")) {
      row.classList.remove("outside");
    }
    if (!droppedCount) return;

    const rows = [...messages.querySelectorAll(".row")];
    if (droppedCount >= rows.length) return;

    for (let i = 0; i < droppedCount; i++) rows[i].classList.add("outside");

    // The divider goes where the boundary actually falls — everything above
    // it is stored but no longer sent, which is what the label's arrow points
    // back at. The dimmed bubbles above it say the same thing a second way.
    const divider = document.createElement("div");
    divider.className = "boundary";
    divider.textContent = "⟵ outside the model's context";
    messages.insertBefore(divider, rows[droppedCount]);
  }

  /**
   * The same rule the agent applies, applied to the rendered transcript: walk
   * back to the Nth most recent user message and call everything before it
   * dropped. Keeping it here means changing the window redraws the boundary
   * immediately, without waiting for another turn.
   */
  function droppedFromTranscript(contextMessages) {
    const rows = [...messages.querySelectorAll(".row")];
    let seen = 0;
    for (let i = rows.length - 1; i >= 0; i--) {
      if (!rows[i].classList.contains("user")) continue;
      if (++seen === contextMessages) return i;
    }
    return 0;
  }

  function renderWindowBanner() {
    const { contextMessages, droppedCount } = windowState;
    windowText.innerHTML = "";

    const plural = contextMessages === 1 ? "" : "s";
    const strong = document.createElement("strong");
    strong.textContent = `Context window: last ${contextMessages} user message${plural}.`;
    windowText.append(strong, " ");
    windowText.append(
      `The agent stores the whole conversation but only sends the ${contextMessages} most ` +
        `recent user message${plural}, and the replies to them, to the model. `
    );

    if (droppedCount > 0) {
      const count = document.createElement("span");
      count.className = "dropped";
      count.textContent = `${droppedCount} older message${droppedCount === 1 ? "" : "s"}`;
      windowText.append(count, " are outside the window and invisible to it.");
    } else {
      windowText.append("Nothing has fallen outside it yet.");
    }
  }

  // ---- totals and chart ----------------------------------------------------

  function stat(label, value, unit) {
    const box = document.createElement("div");
    box.className = "stat";
    const name = document.createElement("span");
    name.className = "label";
    name.textContent = label;
    const number = document.createElement("span");
    number.className = "value";
    number.textContent = value;
    if (unit) {
      const suffix = document.createElement("span");
      suffix.className = "unit";
      suffix.textContent = " " + unit;
      number.appendChild(suffix);
    }
    box.append(name, number);
    return box;
  }

  function renderTotals(usage) {
    const { totalInputTokens = 0, totalOutputTokens = 0, totalCostUsd = 0, turnCount = 0 } = usage ?? {};
    const total = totalInputTokens + totalOutputTokens;
    const average = turnCount ? totalCostUsd / turnCount : 0;
    const contextWindow = pricingFor(lastModel)?.contextWindow ?? DEFAULT_CONTEXT_WINDOW;
    const share = lastSentTokens == null ? null : (lastSentTokens / contextWindow) * 100;

    usageStrip.innerHTML = "";
    usageStrip.append(
      stat("Input", formatTokens(totalInputTokens)),
      stat("Output", formatTokens(totalOutputTokens)),
      stat("Total tokens", formatTokens(total)),
      stat("Cost so far", totalCostUsd ? formatCost(totalCostUsd) : "—"),
      stat("Turns", String(turnCount)),
      stat("Avg / turn", turnCount && totalCostUsd ? formatCost(average) : "—"),
      stat(
        "Last request",
        lastSentTokens == null ? "—" : formatTokens(lastSentTokens),
        share == null ? "" : `· ${share.toFixed(share < 1 ? 2 : 1)}% of ${formatTokens(contextWindow)}`
      )
    );
  }

  const SVG = "http://www.w3.org/2000/svg";

  function svgEl(name, attrs) {
    const node = document.createElementNS(SVG, name);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    return node;
  }

  /**
   * Cumulative spend against turn number. No chart library: it is one
   * polyline, two axes and a handful of labels, and a dependency would be a
   * bigger thing to explain than the drawing.
   */
  function renderChart(turns) {
    chart.innerHTML = "";

    // With an unpriced model (the offline FakeProvider, say) there is nothing
    // to plot in dollars, but the token curve tells the same story.
    const priced = turns.some((t) => t.cumulativeCost > 0);
    const series = turns.map((t) => (priced ? t.cumulativeCost : t.cumulativeTokens));

    if (!series.length) {
      chartNote.textContent = "Nothing sent yet — the curve starts at the first turn.";
      return;
    }

    const W = 600, H = 140, PAD_L = 56, PAD_R = 8, PAD_T = 12, PAD_B = 22;
    const max = Math.max(...series, priced ? 0.0001 : 1);
    const x = (i) => PAD_L + (turns.length === 1 ? (W - PAD_L - PAD_R) / 2 : (i / (turns.length - 1)) * (W - PAD_L - PAD_R));
    const y = (v) => PAD_T + (1 - v / max) * (H - PAD_T - PAD_B);

    chart.append(
      svgEl("line", { x1: PAD_L, y1: PAD_T, x2: PAD_L, y2: H - PAD_B, stroke: "currentColor", "stroke-opacity": 0.25 }),
      svgEl("line", { x1: PAD_L, y1: H - PAD_B, x2: W - PAD_R, y2: H - PAD_B, stroke: "currentColor", "stroke-opacity": 0.25 })
    );

    chart.appendChild(
      svgEl("polyline", {
        points: series.map((v, i) => `${x(i)},${y(v)}`).join(" "),
        fill: "none",
        stroke: "var(--accent)",
        "stroke-width": 2,
        "vector-effect": "non-scaling-stroke",
      })
    );

    for (const [i, value] of series.entries()) {
      chart.appendChild(svgEl("circle", { cx: x(i), cy: y(value), r: 2.5, fill: "var(--accent)" }));
    }

    const label = (text, px, py, anchor) => {
      const node = svgEl("text", {
        x: px, y: py, fill: "currentColor", "fill-opacity": 0.55,
        "font-size": 10, "text-anchor": anchor,
      });
      node.textContent = text;
      return node;
    };
    const top = priced ? formatCost(max) : formatTokens(max);
    chart.append(
      label(top, PAD_L - 6, PAD_T + 4, "end"),
      label(priced ? "$0" : "0", PAD_L - 6, H - PAD_B, "end"),
      label("turn 1", PAD_L, H - 8, "start"),
      label("turn " + turns.length, W - PAD_R, H - 8, "end")
    );

    const window = windowState.contextMessages;
    chartNote.textContent = priced
      ? `Cumulative cost after ${turns.length} turn${turns.length === 1 ? "" : "s"}. ` +
        `With a fixed window of ${window} user message${window === 1 ? "" : "s"} the input side of each ` +
        `turn stops growing, so the ` +
        `line is close to straight — sending the full history instead would bend it upward, because ` +
        `every turn would re-send everything said before it.`
      : `Cumulative tokens after ${turns.length} turn${turns.length === 1 ? "" : "s"} — this model has ` +
        `no published price, so there is nothing to plot in dollars. The shape is the point: with a ` +
        `fixed window of ${window} user message${window === 1 ? "" : "s"} the line stays roughly ` +
        `straight, where re-sending the full history every turn would curve it upward.`;
  }

  /** One request feeds the totals strip, the chart and the stored-count. */
  async function refreshUsage(id = sessionId) {
    let data = null;
    try {
      const res = await fetch("/conversations/" + id + "/usage");
      if (res.ok) data = await res.json();
    } catch (err) {
      // A missing chart is not worth failing the page over.
    }

    const turns = data?.turns ?? [];
    const latest = turns.length ? turns[turns.length - 1] : null;
    lastSentTokens = latest?.tokens?.sent ?? null;
    lastModel = latest?.model ?? lastModel;
    windowState.storedMessages = data?.storedMessages ?? 0;
    windowState.droppedCount = droppedFromTranscript(windowState.contextMessages);

    renderTotals(data?.usage);
    renderChart(turns);
    renderWindowBanner();
    markContextBoundary(windowState.droppedCount);
  }

  // ---- sending -------------------------------------------------------------

  async function send() {
    const text = input.value.trim();
    if (!text || pending) return;

    const userRow = addMessage("user", text);
    input.value = "";
    autoGrow();
    setPending(true);
    const thinking = addThinking();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          message: text,
          sessionId,
          contextMessages: Number(contextInput.value),
          maxTokens: Number(maxTokensSelect.value),
        }),
      });
      const data = await res.json().catch(() => ({}));
      thinking.remove();

      if (!res.ok) {
        addMessage("agent", data.error || ("Request failed (" + res.status + ")"), { error: true });
      } else {
        // The user's own message only gets its count once the server has
        // measured it — that number comes from the API, not from guessing.
        userRow.querySelector(".meta").textContent = userMetaLine(data.meta);
        addMessage("agent", data.reply, { meta: data.meta });

        windowState = data.meta.window;
        lastSentTokens = data.meta.tokens?.sent ?? null;
        lastModel = data.meta.model ?? lastModel;
        renderWindowBanner();
        markContextBoundary(windowState.droppedCount);
      }
    } catch (err) {
      thinking.remove();
      addMessage("agent", "Could not reach the server.", { error: true });
    } finally {
      setPending(false);
      input.focus();
      refreshConversations();
      refreshUsage();
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    send();
  });

  input.addEventListener("input", autoGrow);

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      send();
    }
  });

  // Resizing the window re-draws the boundary immediately, before the next
  // turn — that is what makes the trade-off something you can play with.
  contextInput.addEventListener("change", () => {
    const value = Math.min(100, Math.max(1, Math.round(Number(contextInput.value) || 5)));
    contextInput.value = String(value);
    windowState.contextMessages = value;
    windowState.droppedCount = droppedFromTranscript(value);
    renderWindowBanner();
    markContextBoundary(windowState.droppedCount);
  });

  newButton.addEventListener("click", () => {
    // A new conversation is just a new id — the old one stays on the server,
    // reachable from the sidebar. Nothing is reset.
    switchTo(crypto.randomUUID());
    showEmptyState();
    refreshConversations();
    refreshUsage();
    input.focus();
  });

  // ---- conversations -------------------------------------------------------

  function switchTo(id) {
    sessionId = id;
    localStorage.setItem(SESSION_KEY, id);
  }

  function relativeTime(iso) {
    const seconds = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (seconds < 60) return "just now";
    const units = [
      ["m", 60],
      ["h", 3600],
      ["d", 86400],
    ];
    let label = "m", size = 60;
    for (const [unitLabel, unitSize] of units) {
      if (seconds >= unitSize) { label = unitLabel; size = unitSize; }
    }
    return Math.floor(seconds / size) + label + " ago";
  }

  async function paintTranscript(id) {
    messages.innerHTML = "";
    try {
      const res = await fetch("/conversations/" + id);
      if (!res.ok) return showEmptyState();
      const { messages: turns } = await res.json();
      if (!turns?.length) return showEmptyState();
      for (const turn of turns) {
        // Stored messages carry the counts of the turn that produced them, so
        // a repainted transcript shows the same numbers it showed live.
        addMessage(turn.role === "user" ? "user" : "agent", turn.content, {
          meta: turn.tokens ? turn : null,
        });
      }
    } catch (err) {
      showEmptyState();
    }
  }

  async function refreshConversations() {
    let list = [];
    try {
      const res = await fetch("/conversations");
      if (res.ok) list = await res.json();
    } catch (err) {
      // A sidebar we cannot fill is not worth failing the page over.
    }

    conversations.innerHTML = "";
    if (!list.length) {
      conversations.innerHTML = '<p class="empty">Nothing saved yet.</p>';
      return;
    }

    for (const item of list) {
      const row = document.createElement("div");
      row.className = "conversation" + (item.id === sessionId ? " active" : "");

      const text = document.createElement("div");
      text.className = "text";
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = item.title;
      const when = document.createElement("div");
      when.className = "when";
      when.textContent =
        relativeTime(item.updatedAt) + (item.totalCostUsd ? " · " + formatCost(item.totalCostUsd) : "");
      text.append(title, when);

      const remove = document.createElement("button");
      remove.className = "remove";
      remove.type = "button";
      remove.title = "Delete this conversation";
      remove.textContent = "×";

      row.append(text, remove);

      row.addEventListener("click", async () => {
        if (pending || item.id === sessionId) return;
        switchTo(item.id);
        await paintTranscript(item.id);
        refreshConversations();
        refreshUsage();
      });

      remove.addEventListener("click", async (event) => {
        event.stopPropagation();
        if (pending) return;
        try {
          await fetch("/conversations/" + item.id, { method: "DELETE" });
        } catch (err) {
          // Refreshing below will show whether it actually went away.
        }
        if (item.id === sessionId) {
          switchTo(crypto.randomUUID());
          showEmptyState();
        }
        refreshConversations();
        refreshUsage();
      });

      conversations.appendChild(row);
    }
  }

  renderWindowBanner();
  await paintTranscript(sessionId);
  refreshConversations();
  refreshUsage();
</script>
</body>
</html>
