<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>first-agent</title>
<style>
  :root {
    --bg: #f6f6f4;
    --panel: #ffffff;
    --ink: #1d1d1b;
    --muted: #7a7a72;
    --line: #e3e3dd;
    --user: #1d1d1b;
    --user-ink: #ffffff;
    --agent: #efefea;
    --accent: #b8552f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --panel: #1d1d22;
      --ink: #ececea;
      --muted: #8f8f96;
      --line: #2c2c33;
      --user: #ececea;
      --user-ink: #16161a;
      --agent: #26262d;
      --accent: #e08b63;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  .shell {
    width: 100%;
    max-width: 1000px;
    display: flex;
    height: 100vh;
    background: var(--panel);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }

  .app {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .sidebar {
    width: 260px;
    flex: none;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
    background: var(--bg);
  }
  .sidebar h2 {
    margin: 0;
    padding: 20px 16px 12px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  #conversations {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 16px;
  }
  .conversation {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .conversation:hover { background: var(--agent); }
  .conversation.active { background: var(--agent); }
  .conversation.active .title { font-weight: 600; }
  .conversation .text { flex: 1; min-width: 0; }
  .conversation .title {
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .conversation .when { font-size: 12px; color: var(--muted); }
  .conversation .remove {
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 2px 6px;
    line-height: 1;
    font-size: 15px;
    opacity: 0;
  }
  .conversation:hover .remove,
  .conversation .remove:focus { opacity: 1; }
  .conversation .remove:hover { color: var(--accent); }
  .sidebar .empty { padding: 0 10px; font-size: 13px; color: var(--muted); }

  @media (max-width: 720px) {
    .shell { flex-direction: column; height: auto; min-height: 100vh; }
    .sidebar {
      width: 100%;
      border-right: none;
      border-bottom: 1px solid var(--line);
      max-height: 40vh;
    }
    .app { min-height: 60vh; }
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 13px; margin-right: auto; }

  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    padding: 6px 12px;
    font-size: 13px;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: 0.45; cursor: default; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .row { display: flex; flex-direction: column; max-width: 82%; }
  .row.user { align-self: flex-end; align-items: flex-end; }
  .row.agent { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .user .bubble {
    background: var(--user);
    color: var(--user-ink);
    border-bottom-right-radius: 4px;
  }
  .agent .bubble {
    background: var(--agent);
    border-bottom-left-radius: 4px;
  }
  .agent.error .bubble {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
  }

  .meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 5px;
    padding: 0 4px;
  }

  .empty {
    margin: auto;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
  }

  .dots span {
    display: inline-block;
    animation: blink 1.2s infinite both;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  form {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    padding: 16px 24px 20px;
    border-top: 1px solid var(--line);
  }

  textarea {
    flex: 1;
    resize: none;
    font: inherit;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    max-height: 180px;
  }
  textarea:focus { outline: 2px solid var(--muted); outline-offset: -1px; }

  #send {
    background: var(--user);
    color: var(--user-ink);
    border-color: var(--user);
    padding: 10px 18px;
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
  <h2>Conversations</h2>
  <div id="conversations"></div>
</aside>

<div class="app">
  <header>
    <h1>first-agent</h1>
    <span class="sub">a small chat agent</span>
    <button id="new-conversation" type="button">New conversation</button>
  </header>

  <div id="messages" aria-live="polite"></div>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="Say something… (Enter to send, Shift+Enter for a newline)" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>
</div>

<script>
  const SESSION_KEY = "first-agent.sessionId";

  // The id lives in localStorage, not in a page variable: a fresh random id on
  // every load would look like amnesia even with the server persisting fine.
  let sessionId = localStorage.getItem(SESSION_KEY);
  if (!sessionId) {
    sessionId = crypto.randomUUID();
    localStorage.setItem(SESSION_KEY, sessionId);
  }

  const messages = document.getElementById("messages");
  const conversations = document.getElementById("conversations");
  const form = document.getElementById("composer");
  const input = document.getElementById("input");
  const sendButton = document.getElementById("send");
  const newButton = document.getElementById("new-conversation");

  let pending = false;

  function showEmptyState() {
    messages.innerHTML = '<p class="empty">No messages yet — say hello.</p>';
  }

  function clearEmptyState() {
    messages.querySelector(".empty")?.remove();
  }

  function addMessage(who, text, { meta = null, error = false } = {}) {
    clearEmptyState();
    const row = document.createElement("div");
    row.className = "row " + who + (error ? " error" : "");

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);

    if (meta) {
      const line = document.createElement("div");
      line.className = "meta";
      line.textContent = meta.model + " · " + meta.ms + " ms";
      row.appendChild(line);
    }

    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return row;
  }

  function addThinking() {
    clearEmptyState();
    const row = document.createElement("div");
    row.className = "row agent";
    row.innerHTML =
      '<div class="bubble">thinking<span class="dots">' +
      "<span>.</span><span>.</span><span>.</span></span></div>";
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return row;
  }

  function setPending(value) {
    pending = value;
    sendButton.disabled = value;
    newButton.disabled = value;
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
  }

  async function send() {
    const text = input.value.trim();
    if (!text || pending) return;

    addMessage("user", text);
    input.value = "";
    autoGrow();
    setPending(true);
    const thinking = addThinking();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ message: text, sessionId }),
      });
      const data = await res.json().catch(() => ({}));
      thinking.remove();

      if (!res.ok) {
        addMessage("agent", data.error || ("Request failed (" + res.status + ")"), { error: true });
      } else {
        addMessage("agent", data.reply, { meta: data.meta });
      }
    } catch (err) {
      thinking.remove();
      addMessage("agent", "Could not reach the server.", { error: true });
    } finally {
      setPending(false);
      input.focus();
      refreshConversations();
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    send();
  });

  input.addEventListener("input", autoGrow);

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      send();
    }
  });

  newButton.addEventListener("click", () => {
    // A new conversation is just a new id — the old one stays on the server,
    // reachable from the sidebar. Nothing is reset.
    switchTo(crypto.randomUUID());
    showEmptyState();
    refreshConversations();
    input.focus();
  });

  // ---- conversations -------------------------------------------------------

  function switchTo(id) {
    sessionId = id;
    localStorage.setItem(SESSION_KEY, id);
  }

  function relativeTime(iso) {
    const seconds = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (seconds < 60) return "just now";
    const units = [
      ["m", 60],
      ["h", 3600],
      ["d", 86400],
    ];
    let label = "m", size = 60;
    for (const [unitLabel, unitSize] of units) {
      if (seconds >= unitSize) { label = unitLabel; size = unitSize; }
    }
    return Math.floor(seconds / size) + label + " ago";
  }

  async function paintTranscript(id) {
    messages.innerHTML = "";
    try {
      const res = await fetch("/conversations/" + id);
      if (!res.ok) return showEmptyState();
      const { messages: turns } = await res.json();
      if (!turns?.length) return showEmptyState();
      for (const turn of turns) {
        addMessage(turn.role === "user" ? "user" : "agent", turn.content);
      }
    } catch (err) {
      showEmptyState();
    }
  }

  async function refreshConversations() {
    let list = [];
    try {
      const res = await fetch("/conversations");
      if (res.ok) list = await res.json();
    } catch (err) {
      // A sidebar we cannot fill is not worth failing the page over.
    }

    conversations.innerHTML = "";
    if (!list.length) {
      conversations.innerHTML = '<p class="empty">Nothing saved yet.</p>';
      return;
    }

    for (const item of list) {
      const row = document.createElement("div");
      row.className = "conversation" + (item.id === sessionId ? " active" : "");

      const text = document.createElement("div");
      text.className = "text";
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = item.title;
      const when = document.createElement("div");
      when.className = "when";
      when.textContent = relativeTime(item.updatedAt);
      text.append(title, when);

      const remove = document.createElement("button");
      remove.className = "remove";
      remove.type = "button";
      remove.title = "Delete this conversation";
      remove.textContent = "×";

      row.append(text, remove);

      row.addEventListener("click", async () => {
        if (pending || item.id === sessionId) return;
        switchTo(item.id);
        await paintTranscript(item.id);
        refreshConversations();
      });

      remove.addEventListener("click", async (event) => {
        event.stopPropagation();
        if (pending) return;
        try {
          await fetch("/conversations/" + item.id, { method: "DELETE" });
        } catch (err) {
          // Refreshing below will show whether it actually went away.
        }
        if (item.id === sessionId) {
          switchTo(crypto.randomUUID());
          showEmptyState();
        }
        refreshConversations();
      });

      conversations.appendChild(row);
    }
  }

  paintTranscript(sessionId);
  refreshConversations();
</script>
</body>
</html>
