        "Three lifetimes on one wire: the profile outlives this conversation, working memory is " +
          "cleared when the task reaches done, and the digest stands in for everything that has " +
          "scrolled past. The stage rides in the working block and contributes one instruction " +
          "line of its own, so the same question asked in two stages is not the same prompt."
      );
      return;
    }

    if (id === "facts" && panelState.kind === "facts") {
      const count = document.createElement("span");
      count.className = "dropped";
      const facts = panelState.facts?.length ?? 0;
      count.textContent = `${facts} extracted fact${facts === 1 ? "" : "s"}`;
      windowText.append(count, ` + the last ${contextMessages} exchange${contextMessages === 1 ? "" : "s"} verbatim. `);
      windowText.append(
        "Full history is stored but not sent. Everything else that was said is gone unless a " +
          "fact was extracted from it — and extraction runs on every user message, which is " +
          "what it costs."
      );
      return;
    }

    windowText.append(
      `the last ${contextMessages} exchange${contextMessages === 1 ? "" : "s"} verbatim, and nothing else. `
    );
    windowText.append("Full history is stored but not sent. ");
    if (droppedCount > 0) {
      const count = document.createElement("span");
      count.className = "dropped";
      count.textContent = `${droppedCount} message${droppedCount === 1 ? " is" : "s are"}`;
      windowText.append(count, " outside the window, and invisible to the model.");
    } else {
      windowText.append("Nothing has fallen outside it yet.");
    }
  }

  // ---- totals and chart ----------------------------------------------------

  function stat(label, value, unit) {
    const box = document.createElement("div");
    box.className = "stat";
    const name = document.createElement("span");
    name.className = "label";
    name.textContent = label;
    const number = document.createElement("span");
    number.className = "value";
    number.textContent = value;
    if (unit) {
      const suffix = document.createElement("span");
      suffix.className = "unit";
      suffix.textContent = " " + unit;
      number.appendChild(suffix);
    }
    box.append(name, number);
    return box;
  }

  function renderTotals(usage) {
    const {
      totalInputTokens = 0,
      totalOutputTokens = 0,
      totalCostUsd = 0,
      turnCount = 0,
      overheadInputTokens = 0,
      overheadOutputTokens = 0,
      overheadCostUsd = 0,
      overheadCalls = 0,
    } = usage ?? {};
    const total = totalInputTokens + totalOutputTokens;
    const overheadTotal = overheadInputTokens + overheadOutputTokens;
    const average = turnCount ? totalCostUsd / turnCount : 0;
    const contextWindow = pricingFor(lastModel)?.contextWindow ?? DEFAULT_CONTEXT_WINDOW;
    const share = lastSentTokens == null ? null : (lastSentTokens / contextWindow) * 100;

    usageStrip.innerHTML = "";
    usageStrip.append(
      stat("Input", formatTokens(totalInputTokens)),
      stat("Output", formatTokens(totalOutputTokens)),
      stat("Total tokens", formatTokens(total)),
      stat("Cost so far", totalCostUsd ? formatCost(totalCostUsd) : "—"),
      stat("Turns", String(turnCount)),
      stat("Avg / turn", turnCount && totalCostUsd ? formatCost(average) : "—"),
      stat(
        "Last request",
        lastSentTokens == null ? "—" : formatTokens(lastSentTokens),
        share == null ? "" : `· ${share.toFixed(share < 1 ? 2 : 1)}% of ${formatTokens(contextWindow)}`
      ),
      // Kept out of the totals above on purpose: the strategy's own bill is
      // what a saving has to be measured against, so folding it into the
      // conversation's numbers would be marking your own homework.
      stat(
        "Strategy overhead",
        overheadTotal ? formatTokens(overheadTotal) : "—",
        overheadCostUsd
          ? `· ${formatCost(overheadCostUsd)} · ${overheadCalls} call${overheadCalls === 1 ? "" : "s"}`
          : overheadCalls
            ? `· ${overheadCalls} call${overheadCalls === 1 ? "" : "s"}`
            : ""
      )
    );
  }

  /**
   * Cumulative spend against turn number. No chart library: it is one
   * polyline, two axes and a handful of labels, and a dependency would be a
   * bigger thing to explain than the drawing.
   */
  function renderChart(turns) {
    chart.innerHTML = "";

    // With an unpriced model (the offline FakeProvider, say) there is nothing
    // to plot in dollars, but the token curve tells the same story.
    const priced = turns.some((t) => t.cumulativeCost > 0);
    const series = turns.map((t) => (priced ? t.cumulativeCost : t.cumulativeTokens));

    if (!series.length) {
      chartNote.textContent = "Nothing sent yet — the curve starts at the first turn.";
      return;
    }

    const W = 600, H = 140, PAD_L = 56, PAD_R = 8, PAD_T = 12, PAD_B = 22;
    const max = Math.max(...series, priced ? 0.0001 : 1);
    const x = (i) => PAD_L + (turns.length === 1 ? (W - PAD_L - PAD_R) / 2 : (i / (turns.length - 1)) * (W - PAD_L - PAD_R));
    const y = (v) => PAD_T + (1 - v / max) * (H - PAD_T - PAD_B);

    chart.append(
      svgEl("line", { x1: PAD_L, y1: PAD_T, x2: PAD_L, y2: H - PAD_B, stroke: "currentColor", "stroke-opacity": 0.25 }),
      svgEl("line", { x1: PAD_L, y1: H - PAD_B, x2: W - PAD_R, y2: H - PAD_B, stroke: "currentColor", "stroke-opacity": 0.25 })
    );

    chart.appendChild(
      svgEl("polyline", {
        points: series.map((v, i) => `${x(i)},${y(v)}`).join(" "),
        fill: "none",
        stroke: "var(--accent)",
        "stroke-width": 2,
        "vector-effect": "non-scaling-stroke",
      })
    );

    for (const [i, value] of series.entries()) {
      chart.appendChild(svgEl("circle", { cx: x(i), cy: y(value), r: 2.5, fill: "var(--accent)" }));
    }

    const label = (text, px, py, anchor) => {
      const node = svgEl("text", {
        x: px, y: py, fill: "currentColor", "fill-opacity": 0.55,
        "font-size": 10, "text-anchor": anchor,
      });
      node.textContent = text;
      return node;
    };
    const top = priced ? formatCost(max) : formatTokens(max);
    chart.append(
      label(top, PAD_L - 6, PAD_T + 4, "end"),
      label(priced ? "$0" : "0", PAD_L - 6, H - PAD_B, "end"),
      label("turn 1", PAD_L, H - 8, "start"),
      label("turn " + turns.length, W - PAD_R, H - 8, "end")
    );

    const label_ = catalog.find((s) => s.id === strategySelect.value)?.label ?? "this strategy";
    chartNote.textContent = priced
      ? `Cumulative cost after ${turns.length} turn${turns.length === 1 ? "" : "s"} with ${label_}. ` +
        "A capped payload keeps this line close to straight; full history bends it upward, because " +
        "every turn re-sends everything said before it. The strategy's own calls are in this curve too."
      : `Cumulative tokens after ${turns.length} turn${turns.length === 1 ? "" : "s"} — this model has ` +
        "no published price, so there is nothing to plot in dollars. The shape is the point.";
  }

  /** One request feeds the totals strip, the chart and the stored-count. */
  async function refreshUsage(id = sessionId) {
    let data = null;
    try {
      const res = await fetch(`/conversations/${id}/usage` + branchQuery());
      if (res.ok) data = await res.json();
    } catch (err) {
      // A missing chart is not worth failing the page over.
    }

    const turns = data?.turns ?? [];
    const latest = turns.length ? turns[turns.length - 1] : null;
    lastSentTokens = latest?.tokens?.sent ?? null;
    lastModel = latest?.model ?? lastModel;
    windowState.droppedCount = latest?.strategy?.droppedMessages ?? 0;
    windowState.storedMessages = messages.querySelectorAll(".row").length;

    renderTotals(data?.usage);
    renderChart(turns);
    renderWindowBanner();
    markContextBoundary(windowState.droppedCount);
  }

  // ---- sending -------------------------------------------------------------

  /**
   * @param {string} [prompt] - Text to send instead of the composer's. The
   *   stage strip passes `expectedAction.what` when you press *let it
   *   continue*, which is the whole reason that field holds a sentence rather
   *   than a flag: "what to do on the next turn" is something you can send.
   */
  async function send(prompt) {
    const fromStrip = typeof prompt === "string" && prompt.trim();
    const text = fromStrip ? prompt.trim() : input.value.trim();
    if (!text || pending) return;

    const userRow = addMessage("user", text, { prompted: Boolean(fromStrip) });
    if (!fromStrip) input.value = "";
    autoGrow();
    setPending(true);
    const thinking = addThinking();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          message: text,
          sessionId,
          branchId,
          strategy: strategySelect.value,
          profile: profileId,
          project: projectId,
          contextMessages: Number(contextInput.value),
          maxTokens: Number(maxTokensSelect.value),
        }),
      });
      const data = await res.json().catch(() => ({}));
      thinking.remove();

      if (!res.ok) {
        addMessage("agent", data.error || ("Request failed (" + res.status + ")"), { error: true });
      } else {
        // The user's own message only gets its count once the server has
        // measured it — that number comes from the API, not from guessing.
        userRow.querySelector(".meta").textContent = userMetaLine(data.meta);
        userRow.querySelector(".meta").appendChild(forkButton(data.meta.branch.userMessageId));

        // The panel is adopted *before* the reply is drawn: the counter under
        // that reply attributes its input to the blocks this turn sent, and
        // those numbers arrive with the panel.
        panelState = data.meta.strategy.panel ?? panelState;
        addMessage("agent", data.reply, { meta: data.meta, id: data.meta.branch.replyMessageId });

        windowState = { ...windowState, ...data.meta.window };
        lastSentTokens = data.meta.tokens?.sent ?? null;
        lastModel = data.meta.model ?? lastModel;
        branches = data.meta.branches ?? branches;
        strategyId = data.meta.strategy.id;

        const moved = panelState.kind === "facts"
          ? diffFacts(panelState.facts)
          : panelState.kind === "memory"
            ? diffMemory(panelState)
            : data.meta.strategy.overheadCalls && data.meta.strategy.note.startsWith("folded");
        renderPanel();
        renderBranchBar();
        if (moved) flashPanel();

        renderWindowBanner();
        markTransitions(panelState.lifecycle);
        markContextBoundary(windowState.droppedCount);
      }
    } catch (err) {
      thinking.remove();
      addMessage("agent", "Could not reach the server.", { error: true });
    } finally {
      setPending(false);
      input.focus();
      refreshConversations();
      refreshUsage();
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    send();
  });

  input.addEventListener("input", autoGrow);

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      send();
    }
  });

  // Resizing the window re-draws the banner immediately, before the next turn —
  // that is what makes the trade-off something you can play with.
  contextInput.addEventListener("change", () => {
    const value = Math.min(100, Math.max(2, Math.round(Number(contextInput.value) || 10)));
    contextInput.value = String(value);
    windowState.contextMessages = value;
    renderWindowBanner();
  });

  newButton.addEventListener("click", async () => {
    // A new conversation is just a new id — the old one stays on the server,
    // reachable from the sidebar. Nothing is reset.
    switchTo(crypto.randomUUID());
    showEmptyState();
    resetPanel();
    renderPanel();
    renderBranchBar();
    refreshConversations();
    refreshUsage();
    input.focus();
    // **A new conversation still has a panel**, and it is the one thing here
    // that is not empty: the project's rules and the profile are what the very
    // first turn will be sent. Resetting to the placeholder and stopping drew
    // "no rules, nothing known" over a project and a person with plenty of
    // both — the placeholder means *unknown*, and this is what asks.
    await refreshPanel();
  });

  function resetPanel() {
    panelState = { kind: "none", title: "", note: "" };
    previousFacts = new Map();
    changedKeys = new Set();
    lastPaintedStrategy = null;
    paintedTurns = 0;
    branches = [];
    branchId = null;
  }

  // ---- conversations -------------------------------------------------------

  function switchTo(id) {
    sessionId = id;
    localStorage.setItem(SESSION_KEY, id);
  }

  function relativeTime(iso) {
    const seconds = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (seconds < 60) return "just now";
    const units = [
      ["m", 60],
      ["h", 3600],
      ["d", 86400],
    ];
    let label = "m", size = 60;
    for (const [unitLabel, unitSize] of units) {
      if (seconds >= unitSize) { label = unitLabel; size = unitSize; }
    }
    return Math.floor(seconds / size) + label + " ago";
  }

  /**
   * The panel, re-read, without repainting the transcript.
   *
   * What the panel draws depends on the pickers — the rules come from the
   * project and the rows from the profile — so switching either has to ask the
   * server again rather than redraw the answer to the previous question.
   */
  async function refreshPanel() {
    try {
      const res = await fetch("/conversations/" + sessionId + branchQuery());
      if (!res.ok) return;
      const record = await res.json();
      panelState = record.panel ?? panelState;
      renderPanel();
      renderWindowBanner();
    } catch (err) {
      // A panel we could not refresh is the panel we already had.
    }
  }

  async function paintTranscript(id) {
    messages.innerHTML = "";
    lastPaintedStrategy = null;
    paintedTurns = 0;

    try {
      const res = await fetch("/conversations/" + id + branchQuery());
      if (!res.ok) {
        resetPanel();
        renderPanel();
        renderBranchBar();
        return showEmptyState();
      }

      const record = await res.json();
      branches = record.branches ?? [];
      branchId = record.branchId ?? "main";
      panelState = record.panel ?? { kind: "none", title: "", note: "" };
      // A repaint is not a change: the flash belongs to turns, not to reloads.
      previousFacts = new Map([
        ...(panelState.facts ?? []).map((fact) => [fact.key, fact.value]),
        ...(panelState.profile ?? []).map((row) => ["profile:" + row.key, row.value]),
        ...(panelState.task ?? []).map((row) => ["task:" + row.key, row.value]),
      ]);
      changedKeys = new Set();

      // The branch remembers which strategy it was last spoken to with, and
      // the selector follows it — reopening a conversation should not silently
      // switch how it is being managed.
      if (record.strategy) {
        strategyId = record.strategy;
        syncStrategySelect();
      }

      renderPanel();
      renderBranchBar();

      const turns = record.messages ?? [];
      if (!turns.length) return showEmptyState();
      for (const turn of turns) {
        // Stored messages carry the counts of the turn that produced them, so
        // a repainted transcript shows the same numbers it showed live.
        addMessage(turn.role === "user" ? "user" : "agent", turn.content, {
          meta: turn.tokens ? turn : null,
          id: turn.id,
        });
      }

      // Both of these are renders of stored state and nothing else, which is
      // what makes reopening a mid-flight task a page load rather than a
      // model call: the dividers come back where they were, and the banner
      // says what the next turn is for.
      markTransitions(panelState.lifecycle);
      resumeBanner(panelState.lifecycle);
    } catch (err) {
      resetPanel();
      renderPanel();
      renderBranchBar();
      showEmptyState();
    }
  }

  async function refreshConversations() {
    let list = [];
    try {
      const res = await fetch("/conversations");
      if (res.ok) list = await res.json();
    } catch (err) {
      // A sidebar we cannot fill is not worth failing the page over.
    }

    conversations.innerHTML = "";
    if (!list.length) {
      conversations.innerHTML = '<p class="empty">Nothing saved yet.</p>';
      return;
    }

    for (const item of list) {
      const row = document.createElement("div");
      row.className = "conversation" + (item.id === sessionId ? " active" : "");

      const text = document.createElement("div");
      text.className = "text";
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = item.title;
      const when = document.createElement("div");
      when.className = "when";
      when.textContent =
        relativeTime(item.updatedAt) +
        (item.branchCount > 1 ? ` · ${item.branchCount} branches` : "") +
        (item.totalCostUsd ? " · " + formatCost(item.totalCostUsd) : "");
      text.append(title, when);

      const remove = document.createElement("button");
      remove.className = "remove";
      remove.type = "button";
      remove.title = "Delete this conversation";
      remove.textContent = "×";

      row.append(text, remove);

      row.addEventListener("click", async () => {
        if (pending || item.id === sessionId) return;
        switchTo(item.id);
        resetPanel();
        await paintTranscript(item.id);
        refreshConversations();
        refreshUsage();
      });

      remove.addEventListener("click", async (event) => {
        event.stopPropagation();
        if (pending) return;
        try {
          await fetch("/conversations/" + item.id, { method: "DELETE" });
        } catch (err) {
          // Refreshing below will show whether it actually went away.
        }
        if (item.id === sessionId) {
          switchTo(crypto.randomUUID());
          resetPanel();
          showEmptyState();
        }
        refreshConversations();
        refreshUsage();
      });

      conversations.appendChild(row);
    }
  }

  let openByDefault = true;
  try {
    openByDefault = localStorage.getItem(PANEL_OPEN_KEY) !== "0";
  } catch (err) {
    // No stored preference is the same as not having expressed one.
  }
  setPanelOpen(openByDefault);

  // Open unless you said otherwise. The strategy selector decides what goes on
  // the wire and the right-hand panel is drawn from it, so it starts visible.
  try {
    chartPanel.open = localStorage.getItem(CONTROLS_OPEN_KEY) !== "0";
  } catch (err) {
    // A browser that will not remember it still opens by default.
  }
  chartPanel.addEventListener("toggle", () => {
    try {
      localStorage.setItem(CONTROLS_OPEN_KEY, chartPanel.open ? "1" : "0");
    } catch (err) {
      // Not remembering the preference does not break using it.
    }
  });

  await loadCatalog();
  await loadProfiles();
  await loadProjects();
  renderPanel();
  renderWindowBanner();
  await paintTranscript(sessionId);
  refreshConversations();
  refreshUsage();
</script>
</body>
</html>
