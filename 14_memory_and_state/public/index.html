<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>first-agent</title>
<style>
  :root {
    --bg: #f6f6f4;
    --panel: #ffffff;
    --ink: #1d1d1b;
    --muted: #7a7a72;
    --line: #e3e3dd;
    --user: #1d1d1b;
    --user-ink: #ffffff;
    --agent: #efefea;
    --accent: #b8552f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --panel: #1d1d22;
      --ink: #ececea;
      --muted: #8f8f96;
      --line: #2c2c33;
      --user: #ececea;
      --user-ink: #16161a;
      --agent: #26262d;
      --accent: #e08b63;
    }
  }

  * { box-sizing: border-box; }

  /* The document is exactly one viewport tall and never scrolls. Everything
     that can grow — the transcript, the conversation list, the summary — is a
     scroll container of its own, so the composer and the controls stay put. */
  html { height: 100%; }

  body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    display: flex;
    justify-content: center;
  }

  .shell {
    width: 100%;
    max-width: 1320px;
    display: flex;
    height: 100%;
    min-height: 0;
    background: var(--panel);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }

  /* The chat and the summary travel together: side by side when there is
     room, stacked when there is not. Wrapping them in one box is what lets
     the summary sit *below* the chat on a narrow screen without the flex
     rows of `.shell` deciding how tall each of them gets. */
  .main {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    display: flex;
  }

  .app {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .sidebar {
    width: 260px;
    flex: none;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
    background: var(--bg);
  }
  .sidebar h2 {
    margin: 0;
    padding: 20px 16px 12px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  #conversations {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 16px;
  }
  .conversation {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .conversation:hover { background: var(--agent); }
  .conversation.active { background: var(--agent); }
  .conversation.active .title { font-weight: 600; }
  .conversation .text { flex: 1; min-width: 0; }
  .conversation .title {
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .conversation .when { font-size: 12px; color: var(--muted); }
  .conversation .remove {
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 2px 6px;
    line-height: 1;
    font-size: 15px;
    opacity: 0;
  }
  .conversation:hover .remove,
  .conversation .remove:focus { opacity: 1; }
  .conversation .remove:hover { color: var(--accent); }
  .sidebar .empty { padding: 0 10px; font-size: 13px; color: var(--muted); }

  /* Below this width the third column would squeeze the messages, so the
     summary goes under the chat instead of beside it. It is reference
     material: it may scroll out of sight, but it may not crowd the thing it
     is reference *for*. */
  @media (max-width: 1080px) {
    .main { flex-direction: column; }
    .summary-panel {
      width: auto;
      max-height: 50vh;
      border-left: none;
      border-top: 1px solid var(--line);
    }
    #window-text { padding: 12px 24px; }
  }

  @media (max-width: 720px) {
    .shell { flex-direction: column; }
    .sidebar {
      width: 100%;
      flex: 0 0 auto;
      max-height: 22vh;
      border-right: none;
      border-bottom: 1px solid var(--line);
    }
    .summary-panel { max-height: 44vh; }
    /* On a phone every fixed row above the transcript is height the
       transcript does not get, so the ones that can be smaller are. */
    .chart svg { height: 80px; }
  }

  /* The name, the totals and the one action share a single row: the title is
     a label, not a landmark, and a row of its own was a row the transcript
     did not get. */
  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .topbar .brand {
    flex: none;
    padding-right: 18px;
    border-right: 1px solid var(--line);
  }
  .topbar .brand h1 { margin: 0; font-size: 15px; letter-spacing: -0.01em; }
  .topbar .brand .sub { display: block; color: var(--muted); font-size: 11px; }
  .topbar #new-conversation { flex: none; }
  /* After the rule above, so it wins. The row is tight on a phone and the
     tagline is the first thing worth spending: the totals are not decorative. */
  @media (max-width: 720px) {
    .topbar { gap: 12px; padding: 8px 14px; }
    .topbar .brand { padding-right: 12px; }
    .topbar .brand .sub { display: none; }
  }

  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    padding: 6px 12px;
    font-size: 13px;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: 0.45; cursor: default; }

  #messages {
    flex: 1 1 auto;
    /* Without this a flex child refuses to shrink past its content, and the
       transcript pushes the composer off the bottom instead of scrolling. */
    min-height: 0;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .row { display: flex; flex-direction: column; max-width: 82%; }
  .row.user { align-self: flex-end; align-items: flex-end; }
  .row.agent { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .user .bubble {
    background: var(--user);
    color: var(--user-ink);
    border-bottom-right-radius: 4px;
  }
  .agent .bubble {
    background: var(--agent);
    border-bottom-left-radius: 4px;
  }
  .agent.error .bubble {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
  }

  .meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 5px;
    padding: 0 4px;
  }

  /* A turn the strip took for you. It is a real user turn — stored as one,
     read by the model as one — and it should not look like a sentence you
     sat down and typed. */
  .row.user.prompted .bubble {
    background: transparent;
    color: var(--muted);
    border: 1px dashed var(--line);
  }
  .row.user.prompted .bubble::before {
    content: "▶ ";
    color: var(--accent);
  }

  .empty {
    margin: auto;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
  }

  .dots span {
    display: inline-block;
    animation: blink 1.2s infinite both;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  /* ---- the stage strip --------------------------------------------------- */

  /* Above the composer, always visible while the memory strategy is loaded.
     It is the highest-value element on the page because it answers "whose
     turn is it" *before* the user types, rather than after they have typed
     something the agent was not waiting for. */
  .stage-strip {
    flex: none;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 14px;
    padding: 10px 24px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
  .stage-strip[hidden] { display: none; }

  .stage-dots { display: flex; align-items: center; gap: 6px; }
  .stage-dots .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
  }
  /* Past solid, current filled and ringed, future hollow. The ring is what
     makes "here" readable at a glance in a row of four small circles. */
  .stage-dots .dot.past { background: var(--muted); border-color: var(--muted); }
  .stage-dots .dot.now {
    background: var(--ink);
    border-color: var(--ink);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 16%, transparent);
  }
  .stage-dots .name {
    margin-left: 4px;
    color: var(--ink);
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .stage-strip .step { color: var(--ink); }
  .stage-strip .step .lead { color: var(--muted); }

  /* Styled distinctly by actor, because the whole job of the line is to be
     read without being read: your turn and its turn should not look alike. */
  .stage-strip .awaiting {
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    white-space: nowrap;
  }
  .stage-strip .awaiting.user {
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .stage-strip .awaiting.agent { color: var(--muted); font-style: italic; }

  .stage-strip .edges { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .stage-strip .edges button { padding: 4px 10px; font-size: 12px; }
  .stage-strip .edges button.warned { border-color: var(--accent); color: var(--accent); }
  /* The one button in the row that spends money, so it is the one that looks
     like an action rather than a navigation. */
  .stage-strip .edges button.go {
    background: var(--user);
    color: var(--user-ink);
    border-color: var(--user);
  }
  .stage-strip .suggestion {
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px dashed var(--accent);
    color: var(--accent);
    font-size: 11px;
  }
  .stage-strip .refused { color: var(--accent); }

  /* The handoff, while it is still a proposal. It takes the whole strip
     because it is the only thing that can happen next. */
  .stage-strip .brief {
    flex: 1 1 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 4px;
  }
  .stage-strip .brief .head { font-size: 12px; color: var(--muted); }
  .stage-strip .brief .head b { color: var(--ink); }
  .stage-strip .brief textarea {
    font-size: 12.5px;
    line-height: 1.55;
    max-height: 340px;
    min-height: 140px;
  }
  .stage-strip .brief .acts { display: flex; gap: 8px; }
  .stage-strip .brief .acts button { padding: 6px 14px; font-size: 13px; }
  .stage-strip .brief .acts button.go {
    background: var(--user);
    color: var(--user-ink);
    border-color: var(--user);
  }

  /* ---- the transition divider and the resume banner ---------------------- */

  /* Thin, and drawn from the log rather than from anything the painter
     remembers: reopening a conversation puts the dividers back in the same
     places, which is the point of deriving the stage from an append-only log
     in the first place. */
  .stage-divider {
    align-self: stretch;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }
  .stage-divider::before,
  .stage-divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .resume {
    align-self: stretch;
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12.5px;
    color: var(--muted);
    background: var(--agent);
  }
  .resume b { color: var(--ink); }
  .resume .what { display: block; margin-top: 3px; color: var(--ink); }

  form#composer {
    flex: none;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    padding: 16px 24px 20px;
    border-top: 1px solid var(--line);
  }

  textarea {
    flex: 1;
    resize: none;
    font: inherit;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    max-height: 180px;
  }
  textarea:focus { outline: 2px solid var(--muted); outline-offset: -1px; }

  #send {
    background: var(--user);
    color: var(--user-ink);
    border-color: var(--user);
    padding: 10px 18px;
    font-size: 14px;
  }

  /* ---- usage strip ------------------------------------------------------ */

  /* Sits between the name and the button, and takes whatever room is left:
     it is the one thing in the row that can usefully scroll. */
  .usage {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    gap: 0;
    overflow-x: auto;
  }
  .stat {
    flex: none;
    padding: 0 18px 0 0;
    margin-right: 18px;
    border-right: 1px solid var(--line);
    white-space: nowrap;
  }
  .stat:last-child { border-right: none; margin-right: 0; padding-right: 0; }
  .stat .label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
  }
  .stat .value { font-size: 15px; font-variant-numeric: tabular-nums; }
  .stat .value .unit { font-size: 12px; color: var(--muted); }

  /* ---- cost chart ------------------------------------------------------- */

  .chart {
    flex: none;
    border-bottom: 1px solid var(--line);
    padding: 10px 24px 12px;
  }
  .chart > summary {
    cursor: pointer;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    list-style: none;
  }
  .chart > summary::before { content: "▾ "; }
  .chart:not([open]) > summary::before { content: "▸ "; }
  .chart svg { display: block; width: 100%; height: 120px; margin-top: 10px; }
  /* The controls sit above the chart they are the bill for, with a rule
     between so the row does not read as one long strip of inputs. */
  .chart .window-banner { padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .chart .note {
    font-size: 12px;
    color: var(--muted);
    margin: 6px 0 0;
    line-height: 1.5;
  }

  /* ---- context-window banner -------------------------------------------- */

  .window-banner {
    flex: none;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    flex-wrap: wrap;
    padding: 10px 0 0;
    background: var(--bg);
    font-size: 13px;
    line-height: 1.5;
  }
  .window-banner .controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .window-banner label.toggle {
    flex-direction: row;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    text-transform: none;
    letter-spacing: 0;
  }
  .window-banner label.toggle input { width: auto; }
  .window-banner label {
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
  }
  .window-banner input,
  .window-banner select {
    font: inherit;
    font-size: 13px;
    width: 84px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 5px 8px;
  }

  .row.outside .bubble { opacity: 0.45; }

  .warning {
    margin-top: 6px;
    padding: 8px 12px;
    border: 1px solid var(--accent);
    border-radius: 10px;
    color: var(--accent);
    font-size: 12px;
    line-height: 1.5;
    max-width: 100%;
  }

  /* ---- the active-summary panel ----------------------------------------- */

  /* Reference material, not conversation: smaller, quieter and tighter than
     the transcript, so it reads as something the model is working *from*
     rather than something that was said. */
  /* Everything about *what is being sent*, in one column: the sentence that
     names the three zones, the summary itself, and the panel that puts all
     three ways of asking side by side. The chat column is left to be a chat. */
  .summary-panel {
    width: 340px;
    flex: none;
    min-height: 0;
    display: flex;
    flex-direction: column;
    /* Nothing escapes the column: each section inside it scrolls or is
       capped, so the column's own height is the last word. */
    overflow: hidden;
    border-left: 1px solid var(--line);
    background: var(--bg);
  }

  /* The three-zone sentence. */
  #window-text {
    flex: none;
    margin: 0;
    padding: 18px 14px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--muted);
  }
  #window-text strong { color: var(--ink); }
  #window-text .dropped { color: var(--accent); font-weight: 600; }

  /* The flash on compression stays on the summary itself rather than washing
     over the whole column, which would say "everything here changed". */
  .summary-panel > .head,
  .summary-panel > .summary-body { transition: background-color 0.6s ease; }
  .summary-panel.flash > .head,
  .summary-panel.flash > .summary-body {
    background: color-mix(in srgb, var(--accent) 14%, var(--bg));
  }

  .summary-panel > .head {
    flex: none;
    display: flex;
    align-items: baseline;
    gap: 6px;
    width: 100%;
    padding: 16px 14px 10px;
    border: none;
    border-radius: 0;
    background: transparent;
    text-align: left;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.4;
  }
  .summary-panel > .head:hover { border-color: transparent; color: var(--ink); }
  .summary-panel > .head .caret { flex: none; }
  .summary-panel > .head .stats { flex: 1; min-width: 0; }
  .summary-panel > .head .stats b {
    color: var(--ink);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }
  .summary-panel > .head .badge {
    flex: none;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--panel);
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .summary-body {
    /* Its own scroll container: a long summary must never push the chat off
       the screen. Beside the chat it fills its column; stacked underneath it
       is capped at 40vh by the breakpoint above. */
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 0 14px 18px;
    font-size: 11.5px;
    line-height: 1.45;
    color: var(--muted);
  }
  .summary-body .sh {
    margin: 10px 0 3px;
    color: var(--ink);
    font-weight: 600;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .summary-body .sh:first-child { margin-top: 0; }
  .summary-body .si { padding-left: 10px; text-indent: -10px; }
  .summary-body .sp { margin: 4px 0; }
  .summary-body .placeholder { font-style: italic; }
  .summary-panel[data-open="false"] .summary-body { display: none; }

  /* ---- the boundary in the transcript ----------------------------------- */

  details.boundary {
    align-self: stretch;
    border: 1px dashed var(--accent);
    border-radius: 10px;
    padding: 8px 12px;
    color: var(--accent);
    font-size: 11px;
    line-height: 1.5;
  }
  details.boundary > summary {
    cursor: pointer;
    list-style: none;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }
  details.boundary > summary::-webkit-details-marker { display: none; }
  details.boundary > summary::before { content: "▸ "; }
  details.boundary[open] > summary::before { content: "▾ "; }
  details.boundary .summary-body {
    max-height: 34vh;
    padding: 8px 0 2px;
    color: var(--muted);
  }

  /* ---- compression notes on a turn -------------------------------------- */

  .folded {
    margin-top: 6px;
    padding: 6px 10px;
    border-left: 2px solid var(--accent);
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.5;
  }
  .folded b { color: var(--accent); font-weight: 600; }

  /* ---- the branch bar ---------------------------------------------------- */

  /* Branching is a storage idea, so it gets a storage-shaped strip: which
     line of the conversation you are on, and how it relates to the others. */
  .branch-bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    font-size: 12px;
  }
  .branch-bar svg { flex: none; display: block; }
  .branch-bar label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
  }
  .branch-bar select {
    font: inherit;
    font-size: 12px;
    max-width: 180px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 8px;
  }
  .branch-bar button { padding: 4px 10px; font-size: 12px; }
  .branch-bar .note { margin-left: auto; color: var(--muted); text-align: right; }
  .branch-bar[hidden] { display: none; }

  /* ---- forking from a message -------------------------------------------- */

  .meta .fork {
    border: none;
    background: transparent;
    color: var(--accent);
    font: inherit;
    font-size: 11px;
    padding: 0 0 0 8px;
    opacity: 0;
    cursor: pointer;
  }
  .row:hover .meta .fork,
  .meta .fork:focus { opacity: 1; }

  /* ---- a strategy change, in the transcript ------------------------------- */

  /* Switching strategy mid-conversation changes what the model can see from
     that point on. Leaving that unmarked makes the turns before and after it
     look like the same conversation behaving inconsistently. */
  .switch {
    align-self: stretch;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }
  .switch::before,
  .switch::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* ---- the facts table --------------------------------------------------- */

  .facts { font-size: 11px; line-height: 1.4; }
  .facts .ns {
    margin: 12px 0 4px;
    color: var(--ink);
    font-weight: 600;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .facts .ns:first-child { margin-top: 0; }
  .facts .fact {
    padding: 3px 6px;
    margin: 0 -6px;
    border-radius: 6px;
    transition: background-color 0.6s ease;
  }
  .facts .fact .k {
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px;
  }
  .facts .fact .v { color: var(--ink); overflow-wrap: anywhere; }
  .facts .fact .was { display: block; color: var(--accent); font-size: 10px; }
  .facts .fact.changed { background: color-mix(in srgb, var(--accent) 14%, var(--bg)); }

  /* ---- the three-layer memory panel --------------------------------------- */

  /* Three sections, drawn as three sections. The layers differ in *lifetime*
     rather than in content, and nothing about a flat list of keys would tell
     you that the middle one is about to be cleared and the top one never is —
     so each section says out loud how long the things under it live. */
  .memory { font-size: 11px; line-height: 1.4; }
  .memory .layer { margin-top: 14px; }
  .memory .layer:first-child { margin-top: 0; }
  .memory .layer > h3 {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin: 0 0 4px;
    color: var(--ink);
    font-weight: 600;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .memory .layer > h3 .lifetime {
    flex: 1;
    color: var(--muted);
    font-weight: 400;
    font-size: 9.5px;
    letter-spacing: 0.02em;
    text-align: right;
    text-transform: none;
  }
  .memory .entry {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    padding: 3px 6px;
    margin: 0 -6px;
    border-radius: 6px;
    transition: background-color 0.6s ease;
  }
  .memory .entry .body { flex: 1; min-width: 0; }
  .memory .entry .k {
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px;
  }
  .memory .entry .v { color: var(--ink); overflow-wrap: anywhere; }
  .memory .entry .was { display: block; color: var(--accent); font-size: 10px; }
  .memory .entry .churn { color: var(--accent); }
  .memory .entry .origin { color: var(--muted); }
  .memory .entry.contested .v { opacity: 0.6; text-decoration: line-through; }
  .memory .entry.legacy .v { text-decoration: none; opacity: 1; }
  .memory .entry.changed { background: color-mix(in srgb, var(--accent) 14%, var(--bg)); }

  /* The row buttons stay out of the way until the row is under the cursor.
     Every one of them is destructive or permanent, and a panel of small red
     verbs reads as a control surface rather than as a memory. */
  .memory .acts { display: flex; gap: 4px; flex: none; opacity: 0; transition: opacity 0.15s ease; }
  .memory .entry:hover .acts,
  .memory .acts:focus-within { opacity: 1; }
  .memory button.act,
  .memory button.finish {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 1px 7px;
    font: inherit;
    font-size: 9.5px;
    cursor: pointer;
  }
  .memory button.act:hover { color: var(--accent); border-color: var(--accent); }
  .memory button.finish {
    width: 100%;
    margin-top: 6px;
    padding: 5px;
    border-radius: 7px;
    font-size: 10.5px;
  }
  .memory button.finish:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
  .memory button:disabled { opacity: 0.45; cursor: default; }

  /* A proposal is not memory yet. It is drawn as a form, because that is what
     it is: an editable sentence with a yes and a no, and nothing is written
     anywhere until one of them is pressed. */
  .memory .proposal {
    border: 1px dashed color-mix(in srgb, var(--accent) 55%, var(--line));
    border-radius: 7px;
    padding: 6px 7px;
    margin: 6px 0;
  }
  .memory .proposal textarea {
    width: 100%;
    margin: 3px 0;
    padding: 4px 5px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    font-size: 11px;
    resize: vertical;
  }
  .memory .proposal .acts { opacity: 1; }
  .memory .proposal.answered { opacity: 0.55; border-style: solid; }
  .memory .past { margin: 4px 0; color: var(--muted); }
  .memory .past summary { cursor: pointer; }
  .memory .past .entry { color: var(--muted); }
  .memory .discarded { color: var(--muted); font-style: italic; }
  .memory .discarded code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-style: normal;
  }
  .memory .none { color: var(--muted); font-style: italic; }
  .memory .digest { margin-top: 4px; }

  /* ---- invariants ---------------------------------------------------------
     Drawn first, because that is where they are on the wire and because they
     outrank everything under them. The left rule is the only ornament: it is
     the one section whose rows are not a claim about what is true but a claim
     about what is allowed. */
  .memory .layer.rules { border-left: 2px solid var(--accent); padding-left: 7px; }
  .memory .rule-row { padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .memory .rule-row:last-of-type { border-bottom: 0; }
  .memory .rule-row .k {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px;
    color: var(--muted);
  }
  .memory .rule-row .v { margin-top: 1px; }
  .memory .rule-row .check {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font-size: 10px;
  }
  /* A refusal is the visible artefact of the whole feature, so it is drawn on
     the rule that caused it rather than in a list somewhere else. */
  .memory .refusal {
    margin-top: 4px;
    padding: 4px 6px;
    border-left: 2px solid color-mix(in srgb, var(--accent) 60%, var(--line));
    background: color-mix(in srgb, var(--accent) 6%, transparent);
    border-radius: 0 5px 5px 0;
    font-size: 10.5px;
  }
  .memory .refusal .alt { display: block; margin-top: 2px; color: var(--muted); }
  .memory .refusal .dead { display: block; margin-top: 2px; color: var(--accent); }
  .memory .rules textarea {
    width: 100%;
    margin-top: 4px;
    padding: 4px 5px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    font-size: 11px;
    resize: vertical;
  }
  .memory .draft { margin: 6px 0; }
  .memory .draft .row-key {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px;
  }
  .memory .draft .tag {
    display: inline-block;
    margin-right: 4px;
    padding: 0 5px;
    border-radius: 999px;
    border: 1px solid var(--line);
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .memory .draft .tag.amend { border-color: var(--accent); color: var(--accent); }
  .memory .draft .tag.reject { opacity: 0.7; }
  .stage-strip .brief .open { margin-top: 6px; }
  .stage-strip .brief .open .head {
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .stage-strip .brief .open .pair {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 2px 0;
    font-size: 11px;
  }
  .stage-strip .brief .open .pair span { flex: 1; }
  .stage-strip .brief .open .pair em { color: var(--accent); font-style: normal; font-size: 10px; }
  .stage-strip .brief .open .pair button {
    flex: none;
    width: 20px;
    height: 20px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    cursor: pointer;
  }
  .stage-strip .brief .open .pair button:hover { color: var(--accent); border-color: var(--accent); }

  .memory .draft input {
    width: 100%;
    margin-top: 3px;
    padding: 4px 5px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    font-size: 11px;
  }

  /* ---- the profile picker, the editor and the comparison ------------------ */

  /* The picker sits in the topbar rather than in the panel because it is not a
     fact about this conversation: the same conversation can be asked the same
     question as two different people, which is the entire demonstration. */
  .topbar .picker {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: none;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
  }
  .topbar .picker select {
    font: inherit;
    font-size: 12px;
    text-transform: none;
    letter-spacing: 0;
    max-width: 170px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 8px;
  }
  /* It wraps rather than hides. The subtitle beside the brand can disappear on
     a narrow window because it says nothing; this is the only control for
     *whose* long-term memory is on the wire, and a control you cannot reach is
     the same as a feature that is not there. */
  @media (max-width: 900px) {
    .topbar { flex-wrap: wrap; gap: 10px 14px; }
    .topbar .picker { font-size: 9.5px; }
    .topbar .picker select { max-width: 130px; }
  }

  /* A declared row is one you wrote down on purpose. It is the flag that
     decides whether a model may overwrite it and whether the task in hand may
     displace it on the wire, so it is marked rather than left to be inferred
     from a store nobody reads. */
  .memory .entry.declared { border-left: 2px solid var(--accent); padding-left: 6px; margin-left: -8px; }
  .memory .entry.declared .origin { color: var(--accent); }
  .memory .entry.declared .v { text-decoration: none; opacity: 1; }
  .memory .entry .pending {
    display: block;
    margin-top: 2px;
    color: var(--accent);
    font-size: 10px;
  }

  /* The editor is a form, drawn as a form. Everything in it is written to the
     profile store the moment you press Save — there is no proposal step,
     because you are the person a proposal would be addressed to. */
  .memory .editor { margin: 4px 0 0; }
  .memory .editor > summary { cursor: pointer; color: var(--muted); }
  .memory .editor label {
    display: block;
    margin-top: 7px;
    color: var(--muted);
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .memory .editor input,
  .memory .editor textarea {
    width: 100%;
    margin-top: 2px;
    padding: 4px 5px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    font-size: 11px;
    resize: vertical;
  }
  .memory .editor .pair { display: flex; gap: 4px; align-items: center; margin-top: 4px; }
  .memory .editor .pair input.key {
    flex: 0 0 38%;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px;
  }
  .memory .editor .pair input.val { flex: 1; }
  .memory .editor .pair button {
    flex: none;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    width: 20px;
    height: 20px;
    padding: 0;
    font: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .memory .editor .pair button:hover { color: var(--accent); border-color: var(--accent); }
  .memory .editor .hint { margin: 3px 0 0; color: var(--muted); font-size: 9.5px; font-style: italic; }

  /* What each layer costs, per turn, as three numbers. The third is the one
     that is easy to forget: it is not a call, it is the block riding in the
     input of every single turn. */
  .memory .spend { margin-top: 4px; }
  .memory .spend .row { display: flex; gap: 6px; padding: 2px 0; }
  .memory .spend .row .what { flex: 1; color: var(--muted); }
  .memory .spend .row .num { font-variant-numeric: tabular-nums; }
  .memory .spend .row.estimated .what::after { content: " (estimated)"; opacity: 0.7; }

  dialog.compare {
    width: min(1180px, 94vw);
    max-height: 88vh;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    color: var(--ink);
  }
  dialog.compare::backdrop { background: rgba(0, 0, 0, 0.45); }
  dialog.compare .head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  dialog.compare .head h2 { margin: 0; font-size: 14px; }
  dialog.compare .head .note { flex: 1; color: var(--muted); font-size: 11px; }
  dialog.compare .setup { padding: 12px 18px; border-bottom: 1px solid var(--line); }
  dialog.compare .setup textarea {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    resize: vertical;
  }
  dialog.compare .setup .who { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 8px; font-size: 12px; }
  dialog.compare .setup .who label { display: flex; align-items: center; gap: 4px; color: var(--muted); }
  dialog.compare .setup .who .spacer { flex: 1; }
  dialog.compare .results {
    display: flex;
    gap: 0;
    overflow: auto;
    max-height: 56vh;
    padding: 0 6px 12px;
  }
  dialog.compare .arm {
    flex: 1 0 320px;
    min-width: 0;
    padding: 12px;
    border-right: 1px solid var(--line);
  }
  dialog.compare .arm:last-child { border-right: none; }
  dialog.compare .arm h3 {
    margin: 0 0 2px;
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  dialog.compare .arm .who { color: var(--muted); font-size: 10.5px; }
  dialog.compare .arm details { margin: 6px 0; }
  dialog.compare .arm details summary { cursor: pointer; color: var(--muted); font-size: 10.5px; }
  dialog.compare .arm pre {
    margin: 4px 0 0;
    padding: 6px;
    background: var(--bg);
    border-radius: 6px;
    font-size: 10px;
    line-height: 1.45;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  dialog.compare .run { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 6px; }
  dialog.compare .run .label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
  dialog.compare .run .body { font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  dialog.compare .foot { padding: 10px 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
  dialog.compare .placeholder { padding: 24px 18px; color: var(--muted); font-size: 12px; }

  /* ---- the strategy selector --------------------------------------------- */

  .window-banner .strategy-note {
    flex-basis: 100%;
    margin: 0;
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.5;
  }
  .window-banner select#strategy { width: auto; min-width: 150px; }
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
  <h2>Conversations</h2>
  <div id="conversations"></div>
</aside>

<div class="main">
<div class="app">
  <div class="topbar">
    <div class="brand">
      <h1>first-agent</h1>
      <span class="sub">a small chat agent</span>
    </div>
    <div class="usage" id="usage"></div>
    <label class="picker" for="profile">Profile
      <select id="profile" title="Whose long-term memory this conversation reads and writes."></select>
    </label>
    <label class="picker" for="project">Project
      <select id="project" title="Whose invariants this conversation is subject to. The rules belong to the codebase, not to you."></select>
    </label>
    <button id="new-conversation" type="button">New conversation</button>
  </div>

  <!-- **What goes on the wire, and what it costs, in one place.** The
       controls decide the payload and the chart is the bill for it, so they
       are one collapsible row rather than one above the transcript and one
       below it. Open by default: the strategy selector is the control the
       right-hand panel is drawn from, and a control nobody can find is a
       control nobody uses. -->
  <details class="chart" id="chart-panel" open>
    <summary>Strategy &amp; cost</summary>
    <div class="window-banner">
      <div class="controls">
        <label for="strategy">Strategy
          <select id="strategy"></select>
        </label>
        <label title="How many exchanges are kept verbatim. What that means is the strategy's business.">Window (exchanges)
          <input id="context-messages" type="number" min="2" max="100" step="1" value="10">
        </label>
        <label>Max tokens
          <select id="max-tokens">
            <option value="30">30</option>
            <option value="300">300</option>
            <option value="1024" selected>1024</option>
          </select>
        </label>
      </div>
      <p class="strategy-note" id="strategy-note"></p>
    </div>
    <svg id="chart" viewBox="0 0 600 140" preserveAspectRatio="none" role="img"
         aria-label="Cumulative cost by turn"></svg>
    <p class="note" id="chart-note"></p>
  </details>

  <div class="branch-bar" id="branch-bar" hidden>
    <svg id="branch-tree" role="img" aria-label="Branches"></svg>
    <label for="branch-select">Branch
      <select id="branch-select"></select>
    </label>
    <button id="delete-branch" type="button" title="Delete this branch">Delete</button>
    <span class="note" id="branch-note"></span>
  </div>

  <div id="messages" aria-live="polite"></div>

  <!-- Above the composer and outside it: the answer to "whose turn is it"
       belongs where you look before typing, not in the panel you may have
       collapsed. -->
  <div class="stage-strip" id="stage-strip" hidden></div>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="Say something… (Enter to send, Shift+Enter for a newline)" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<aside class="summary-panel" id="context-panel" data-open="true">
  <p class="text" id="window-text"></p>

  <button class="head" id="panel-toggle" type="button" aria-expanded="true" aria-controls="panel-body">
    <span class="caret">▾</span>
    <span class="stats" id="panel-stats"><b>Context</b></span>
    <span class="badge" id="panel-badge" hidden>just updated</span>
  </button>
  <div class="summary-body" id="panel-body"></div>
</aside>
</div>
</div>

<dialog class="compare" id="compare-dialog">
  <div class="head">
    <h2>Same question, different people</h2>
    <span class="note" id="compare-note">Read-only: nothing here is written to a profile or to this conversation.</span>
    <button id="compare-close" type="button">Close</button>
  </div>
  <div class="setup">
    <textarea id="compare-message" rows="2" placeholder="One question, asked of every profile…"></textarea>
    <div class="who" id="compare-who"></div>
  </div>
  <div class="results" id="compare-results">
    <p class="placeholder">Pick two or more profiles and run it.</p>
  </div>
  <p class="foot" id="compare-foot"></p>
</dialog>

<script type="module">
  // The formatters and the price table come from the server's own module, so a
  // number in the UI is formatted by exactly the code that priced it.
  import { formatCost, formatTokens, pricingFor } from "/pricing.js";

  const SESSION_KEY = "first-agent.sessionId";
  const PANEL_OPEN_KEY = "first-agent.panelOpen";
  // The merged strategy-and-cost row remembers whether you closed it, for the
  // same reason the right-hand panel does: a thing you collapsed once and have
  // to collapse again on every reload is a thing you stop collapsing.
  const CONTROLS_OPEN_KEY = "first-agent.controlsOpen";
  // Which profile the topbar is pointing at. It lives beside the session id
  // rather than in the conversation because it is not a property of the
  // conversation: the same chat can be continued as someone else, and that is
  // the whole point of the picker.
  const PROFILE_KEY = "first-agent.profile";
  // The project is remembered the same way and for a different reason: which
  // codebase you are working in is not a property of any one chat either, and
  // opening a new conversation in the same repository should not mean losing
  // its rules until you remember to pick them again. The conversation record
  // holds the answer too, and it wins when the two disagree.
  const PROJECT_KEY = "first-agent.project";
  /** The value the picker uses for "make one that does not exist yet". */
  const NEW_PROFILE = "\u0000new";
  // How long the panel stays lit after the strategy changed something. Long
  // enough to notice on the turn it happened, short enough not to still be
  // shouting two turns later.
  const FLASH_MS = 4000;
  // What the "% of the window" figure is measured against. The real number
  // comes from the model that actually answered; 200K is the stand-in until
  // one has.
  const DEFAULT_CONTEXT_WINDOW = 200000;

  // The id lives in localStorage, not in a page variable: a fresh random id on
  // every load would look like amnesia even with the server persisting fine.
  let sessionId = localStorage.getItem(SESSION_KEY);
  if (!sessionId) {
    sessionId = crypto.randomUUID();
    localStorage.setItem(SESSION_KEY, sessionId);
  }

  const messages = document.getElementById("messages");
  const conversations = document.getElementById("conversations");
  const form = document.getElementById("composer");
  const input = document.getElementById("input");
  const sendButton = document.getElementById("send");
  const newButton = document.getElementById("new-conversation");
  const usageStrip = document.getElementById("usage");
  const chart = document.getElementById("chart");
  const chartNote = document.getElementById("chart-note");
  const windowText = document.getElementById("window-text");
  const contextInput = document.getElementById("context-messages");
  const maxTokensSelect = document.getElementById("max-tokens");
  const strategySelect = document.getElementById("strategy");
  const strategyNote = document.getElementById("strategy-note");
  const branchBar = document.getElementById("branch-bar");
  const branchTree = document.getElementById("branch-tree");
  const branchSelect = document.getElementById("branch-select");
  const branchNote = document.getElementById("branch-note");
  const deleteBranchButton = document.getElementById("delete-branch");
  const contextPanel = document.getElementById("context-panel");
  const panelToggle = document.getElementById("panel-toggle");
  const panelStats = document.getElementById("panel-stats");
  const panelBadge = document.getElementById("panel-badge");
  const panelBody = document.getElementById("panel-body");
  const chartPanel = document.getElementById("chart-panel");
  const profileSelect = document.getElementById("profile");
  const projectSelect = document.getElementById("project");
  const stageStrip = document.getElementById("stage-strip");
  const compareDialog = document.getElementById("compare-dialog");
  const compareMessage = document.getElementById("compare-message");
  const compareWho = document.getElementById("compare-who");
  const compareResults = document.getElementById("compare-results");
  const compareFoot = document.getElementById("compare-foot");
  const compareNote = document.getElementById("compare-note");

  let pending = false;
  /** How many replies have been drawn, so a turn can be named while painting. */
  let paintedTurns = 0;
  /** Id, label and one line of description for each, straight from the registry. */
  let catalog = [];
  let branches = [];
  /** Null until the server says which branch is active — it knows and we do not. */
  let branchId = null;
  /** Which strategy the composer will send. Follows the branch until changed. */
  let strategyId = null;
  /**
   * Whatever the active strategy says about its own state: `{ kind, … }`. The
   * page never reads a field belonging to one particular strategy without
   * first looking at `kind`, which is the same discipline the server keeps.
   */
  let panelState = { kind: "none", title: "", note: "" };
  /** The previous fact values, so a changed row can say what it used to say. */
  let previousFacts = new Map();
  let changedKeys = new Set();
  /** The strategy the last painted turn was taken with, for the switch marker. */
  let lastPaintedStrategy = null;
  let windowState = {
    contextMessages: Number(contextInput.value),
    droppedCount: 0,
    storedMessages: 0,
    verbatimExchanges: 0,
  };
  let lastSentTokens = null;
  let lastModel = null;
  let flashTimer = null;
  /** Every profile the store knows about, for the picker and the comparison. */
  let profiles = [];
  /** Whose long-term memory the next turn reads and writes. */
  let profileId = storedProfile();
  /**
   * The selected profile **as the store holds it now**, for the editor.
   *
   * Deliberately not the panel's profile rows: those are what was *sent* on
   * the last turn of this branch, stamped and branch-local. A form seeded from
   * them would be editing a snapshot, and on a fork it would be editing a
   * snapshot several turns out of date.
   */
  let profileEntries = [];
  /** Which arms the comparison dialog will run, across openings. */
  let compareWith = new Set();
  /** Every project with a rule set, for the picker. */
  let projects = [];
  /** Which project's invariants this conversation is subject to. */
  let projectId = storedProject();
  /**
   * The rows the last *Propose* call came back with, and the prose that
   * produced them.
   *
   * They live in the page and nowhere else, which is the point: a proposal is
   * not memory, and until a row is accepted there is nothing on the server
   * that knows it was ever drafted. A failed call leaves the typed text
   * exactly where it was.
   */
  let invariantRows = [];
  let invariantDraft = "";

  function storedProject() {
    try {
      return localStorage.getItem(PROJECT_KEY) || "default";
    } catch (err) {
      return "default";
    }
  }

  function storedProfile() {
    try {
      return localStorage.getItem(PROFILE_KEY) || "local";
    } catch (err) {
      return "local";
    }
  }

  /** `?branchId=…`, or nothing at all until we know which branch that is. */
  /**
   * The branch, and which pickers the page is on.
   *
   * The two ids ride along because the panel answers *what would the next turn
   * be sent* — and the next turn is sent whatever the topbar currently says,
   * not whatever the last one happened to use. Without them a conversation
   * nobody has spoken in yet has no snapshot to draw from and comes back with
   * an empty rule set and an empty profile.
   */
  function branchQuery() {
    const params = new URLSearchParams();
    if (branchId) params.set("branchId", branchId);
    if (profileId) params.set("profile", profileId);
    if (projectId) params.set("project", projectId);
    // Which panel to preview for a conversation nobody has spoken in yet. A
    // branch with history answers this for itself and the server ignores it.
    if (strategySelect.value) params.set("strategy", strategySelect.value);
    const query = params.toString();
    return query ? "?" + query : "";
  }

  /** Just the pickers, for the routes that do not take a branch in the query. */
  function pickerQuery() {
    const params = new URLSearchParams();
    if (profileId) params.set("profile", profileId);
    if (projectId) params.set("project", projectId);
    const query = params.toString();
    return query ? "?" + query : "";
  }

  function showEmptyState() {
    messages.innerHTML = '<p class="empty">No messages yet — say hello.</p>';
  }

  function clearEmptyState() {
    messages.querySelector(".empty")?.remove();
  }

  /** `claude-haiku-4-5-20251001` → `haiku-4.5`. The date is noise in a counter. */
  function shortModel(model) {
    if (!model) return "";
    const match = /^claude-([a-z]+)-(\d+)-(\d+)/.exec(model);
    return match ? `${match[1]}-${match[2]}.${match[3]}` : model;
  }

  /**
   * A turn's strategy facts, wherever they came from: a live `meta` carries
   * them under `strategy`, a stored message carries them at the top level —
   * and a message written by Day 9 carries them under `compression`, from when
   * there was only one strategy and it did not have a name.
   */
  function strategyOf(meta) {
    if (!meta) return null;
    if (meta.strategy) return meta.strategy;
    const legacy = meta.compression ?? meta.tokens?.compression;
    if (!legacy) return null;
    return {
      id: "summary",
      label: "Rolling summary",
      blockTokens: legacy.summaryTokens ?? 0,
      overheadTokens: legacy.summarizerTokens ?? 0,
      overheadCost: legacy.summarizerCost ?? null,
      overheadMs: legacy.summarizerMs ?? null,
      overheadCalls: legacy.compressedThisTurn ? 1 : 0,
      droppedMessages: legacy.summarizedMessages ?? 0,
      note: legacy.compressedThisTurn ? `folded ${legacy.foldedMessages} messages in` : "",
    };
  }

  /** The word the per-turn counter uses for the block a strategy injects. */
  const BLOCK_WORD = { summary: "summary", facts: "facts", memory: "memory" };

  /**
   * `(140 profile, 98 task)` — the blocks called out **inside** the input
   * figure, not added to it.
   *
   * The total is measured: the server counted the request twice, once with the
   * blocks and once without. The split across them is not — it is that
   * measured total apportioned by the size of each block on the turn it was
   * sent, which the strategy records in its own state as it builds them. An
   * exact per-block count would need three more count calls per turn to answer
   * a question about proportions, which is not worth three network round trips.
   *
   * Turns taken before the strategy started recording, and turns on some other
   * branch, have no row: those fall back to the single total.
   */
  function blockNote(strategy, turn) {
    const total = strategy?.blockTokens;
    const word = BLOCK_WORD[strategy?.id];
    if (!total || !word) return "";
    if (strategy.id !== "memory") return ` (${formatTokens(total)} ${word})`;

    const row = (panelState.kind === "memory" ? panelState.attribution ?? [] : []).find(
      (entry) => entry.turn === turn
    );
    const parts = [
      ["profile", row?.profile ?? 0],
      ["task", row?.working ?? 0],
      ["digest", row?.digest ?? 0],
    ].filter(([, size]) => size > 0);
    const characters = parts.reduce((sum, [, size]) => sum + size, 0);
    if (!characters) return ` (${formatTokens(total)} memory)`;

    return (
      " (" +
      parts
        .map(([label, size]) => `${formatTokens(Math.round((total * size) / characters))} ${label}`)
        .join(", ") +
      ")"
    );
  }

  /**
   * The line under a reply: real billed tokens, what they cost, how long it
   * took, and which model said it.
   *
   * The strategy's block is called out inside the input figure rather than
   * added to it. It is not extra tokens on top of the request — it *is* part
   * of the request, and the interesting question is how much of the input it
   * accounts for.
   */
  function agentMetaLine(meta, turn) {
    const { tokens, cost, model, ms } = meta;
    const strategy = strategyOf(meta);
    const parts = [];
    if (tokens?.input != null) {
      parts.push(formatTokens(tokens.input) + " in" + blockNote(strategy, turn));
    }
    if (tokens?.output != null) parts.push(formatTokens(tokens.output) + " out");
    if (cost?.total != null) parts.push(formatCost(cost.total));
    if (ms != null) parts.push((ms / 1000).toFixed(1) + "s");
    if (model) parts.push(shortModel(model));
    return parts.join(" · ");
  }

  /**
   * The turn where the strategy did some work, with its own bill attached.
   * Hiding that cost would make context management look free, and the whole
   * reason to measure it is that it is not.
   */
  function overheadNote(strategy) {
    const box = document.createElement("div");
    box.className = "folded";
    const lead = document.createElement("b");
    lead.textContent = strategy.note || "the strategy ran";
    box.appendChild(lead);

    const bill = [];
    if (strategy.overheadTokens) bill.push(formatTokens(strategy.overheadTokens) + " overhead tokens");
    if (strategy.overheadCost != null) bill.push(formatCost(strategy.overheadCost));
    if (strategy.overheadMs != null) bill.push((strategy.overheadMs / 1000).toFixed(1) + "s");
    if (bill.length) box.append(" · " + bill.join(" · "));
    return box;
  }

  /** `Strategy → Extracted facts`, drawn between the turns it separates. */
  function switchMarker(label) {
    const marker = document.createElement("div");
    marker.className = "switch";
    marker.textContent = "switched to " + label;
    messages.appendChild(marker);
  }

  function addMessage(who, text, { meta = null, error = false, id = null, prompted = false } = {}) {
    clearEmptyState();

    const strategy = strategyOf(meta);
    if (who !== "user" && strategy?.id && lastPaintedStrategy && strategy.id !== lastPaintedStrategy) {
      switchMarker(strategy.label ?? strategy.id);
    }
    if (who !== "user" && strategy?.id) lastPaintedStrategy = strategy.id;

    // Which exchange this is, counted as it is drawn. The per-turn counter
    // needs it to look up what the blocks cost on that particular turn.
    if (who !== "user" && !error) paintedTurns += 1;
    const turn = paintedTurns;

    const row = document.createElement("div");
    // A turn the strip took on your behalf is still your turn — it is stored
    // as one and the model reads it as one — but it should not read in the
    // transcript as a sentence you typed.
    row.className = "row " + who + (error ? " error" : "") + (prompted ? " prompted" : "");

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);

    if (meta?.truncated) row.appendChild(truncationWarning());
    if (who !== "user" && strategy?.overheadCalls) row.appendChild(overheadNote(strategy));

    const line = document.createElement("div");
    line.className = "meta";
    line.textContent = meta
      ? who === "user"
        ? userMetaLine(meta)
        : agentMetaLine(meta, turn)
      : "";
    // Forking is offered on the message, not in a dialogue box: "what if I had
    // said something else here" is a question about one specific message.
    if (!error && id) line.appendChild(forkButton(id));
    if (!error) row.appendChild(line);

    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return row;
  }

  function forkButton(messageId) {
    const button = document.createElement("button");
    button.className = "fork";
    button.type = "button";
    button.textContent = "Fork from here";
    button.addEventListener("click", (event) => {
      event.stopPropagation();
      forkFrom(messageId);
    });
    return button;
  }

  function userMetaLine(meta) {
    const count = meta.tokens?.request;
    return count == null ? "" : formatTokens(count) + " tokens";
  }

  function truncationWarning() {
    const box = document.createElement("div");
    box.className = "warning";
    box.textContent =
      "Cut off: the reply hit the max_tokens ceiling and stopped mid-sentence. " +
      "It was still saved to history exactly as it arrived, so on the next turn " +
      "the model will read its own unfinished sentence as something it meant to say.";
    return box;
  }

  function addThinking() {
    clearEmptyState();
    const row = document.createElement("div");
    row.className = "row agent";
    row.innerHTML =
      '<div class="bubble">thinking<span class="dots">' +
      "<span>.</span><span>.</span><span>.</span></span></div>";
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return row;
  }

  function setPending(value) {
    pending = value;
    sendButton.disabled = value;
    newButton.disabled = value;
    branchSelect.disabled = value;
    strategySelect.disabled = value;
    // The panel's own buttons write to memory, and so do the strip's. A second
    // click while the first is in flight would be applied to a state the page
    // has not seen yet.
    for (const button of panelBody.querySelectorAll("button")) button.disabled = value;
    for (const button of stageStrip.querySelectorAll("button")) button.disabled = value;
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
  }

  // ---- the strategy selector -----------------------------------------------

  async function loadCatalog() {
    try {
      const res = await fetch("/strategies");
      if (!res.ok) return;
      const data = await res.json();
      catalog = data.strategies ?? [];
      strategyId ??= data.default ?? null;
    } catch (err) {
      // Without the catalogue the selector is empty and everything else works.
    }

    strategySelect.innerHTML = "";
    for (const strategy of catalog) {
      const option = document.createElement("option");
      option.value = strategy.id;
      option.textContent = strategy.label;
      strategySelect.appendChild(option);
    }
    syncStrategySelect();
  }

  function syncStrategySelect() {
    if (strategyId) strategySelect.value = strategyId;
    const chosen = catalog.find((s) => s.id === strategySelect.value);
    strategyNote.textContent = chosen?.description ?? "";
  }

  strategySelect.addEventListener("change", async () => {
    strategyId = strategySelect.value;
    syncStrategySelect();
    // Switching is not a reset: the old strategy's state stays on the branch
    // and comes back untouched if you switch back. On a branch with history
    // nothing changes until the next turn, which is when the switch actually
    // takes effect.
    renderPanel();
    renderWindowBanner();
    // **But a conversation nobody has spoken in has no state to come back
    // to**, and the panel for it is a preview of what the next turn will
    // carry — which is a different preview for every strategy. Picking
    // `memory` there has to go and ask, or the page draws the placeholder
    // below and calls it an answer: an empty rule set and an empty profile
    // for a project and a person that have plenty of both.
    await refreshPanel();
  });

  // ---- the right-hand column -----------------------------------------------

  /**
   * Render the summary's Markdown-ish structure: `## Section` headers become
   * small bold labels and `- item` lines become bullets. At 11.5px the
   * structure is the only thing that makes it scannable, so it is worth the
   * fifteen lines it takes to draw.
   */
  function renderSummaryInto(target, text) {
    target.innerHTML = "";
    if (!text) return;

    for (const raw of String(text).split("\n")) {
      const line = raw.trim();
      if (!line) continue;
      const node = document.createElement("div");
      if (line.startsWith("#")) {
        node.className = "sh";
        node.textContent = line.replace(/^#+\s*/, "");
      } else if (line.startsWith("- ") || line.startsWith("* ")) {
        node.className = "si";
        node.textContent = "• " + line.slice(2);
      } else {
        node.className = "sp";
        node.textContent = line;
      }
      target.appendChild(node);
    }
  }

  /**
   * The facts table: grouped by namespace, keys in monospace, and a row that
   * changed this turn lit up with what it used to say underneath it.
   *
   * The "was:" line is the whole reason the store keeps superseded values. A
   * fact silently changing is indistinguishable from a fact that was always
   * wrong, and the difference is the only thing that tells you whether the
   * model understood a correction.
   */
  function renderFactsInto(target, facts) {
    target.innerHTML = "";
    const table = document.createElement("div");
    table.className = "facts";

    let namespace = null;
    for (const fact of facts) {
      if (fact.namespace !== namespace) {
        namespace = fact.namespace;
        const heading = document.createElement("div");
        heading.className = "ns";
        heading.textContent = namespace;
        table.appendChild(heading);
      }

      const row = document.createElement("div");
      row.className = "fact" + (changedKeys.has(fact.key) ? " changed" : "");

      const key = document.createElement("div");
      key.className = "k";
      key.textContent = fact.key;

      const value = document.createElement("div");
      value.className = "v";
      value.textContent = fact.value;

      row.append(key, value);

      const was = changedKeys.has(fact.key) ? fact.previous?.[0] : null;
      if (was) {
        const before = document.createElement("span");
        before.className = "was";
        before.textContent = "was: " + was;
        row.appendChild(before);
      }

      table.appendChild(row);
    }

    target.appendChild(table);
  }

  // ---- the profile picker ---------------------------------------------------

  /**
   * The picker is built from the store, never from a list in this file.
   *
   * Same rule as the strategy selector: a second list of what exists is a
   * second list that can be wrong, and this one would be wrong the moment
   * anybody added a profile by dropping a file into `data/memory/`.
   */
  async function loadProfiles() {
    try {
      const res = await fetch("/profiles");
      if (res.ok) {
        const data = await res.json();
        profiles = data.profiles ?? [];
      }
    } catch (err) {
      // A picker we cannot fill still has the profile we are already on.
    }
    if (!profiles.some((profile) => profile.id === profileId)) {
      profiles = [...profiles, { id: profileId, entryCount: 0, updatedAt: null }];
    }
    renderProfileSelect();
    await loadProfileEntries();
  }

  function renderProfileSelect() {
    profileSelect.innerHTML = "";
    for (const profile of profiles) {
      const option = document.createElement("option");
      option.value = profile.id;
      option.textContent =
        profile.id + (profile.entryCount ? ` (${profile.entryCount})` : "");
      profileSelect.appendChild(option);
    }
    const create = document.createElement("option");
    create.value = NEW_PROFILE;
    create.textContent = "New profile…";
    profileSelect.appendChild(create);
    profileSelect.value = profileId;
  }

  /** What the store holds for the selected profile, for the editor to edit. */
  async function loadProfileEntries() {
    try {
      const res = await fetch("/profiles/" + encodeURIComponent(profileId));
      profileEntries = res.ok ? (await res.json()).entries ?? [] : [];
    } catch (err) {
      profileEntries = [];
    }
  }

  profileSelect.addEventListener("change", async () => {
    if (profileSelect.value === NEW_PROFILE) {
      const name = String(window.prompt("A name for the new profile", "") ?? "")
        .trim()
        .toLowerCase();
      // The same rule the store enforces, said here so the answer is instant
      // and the user is not told about a filesystem they never asked about.
      if (!/^[a-z0-9][a-z0-9_-]{0,63}$/.test(name)) {
        profileSelect.value = profileId;
        if (name) memoryNote("A profile name is lowercase letters, digits, dash or underscore.");
        return;
      }
      if (!profiles.some((profile) => profile.id === name)) {
        // It has no file yet, and will not have one until something is
        // declared in it. That is correct: an empty profile is a profile
        // nobody has said anything about.
        profiles = [...profiles, { id: name, entryCount: 0, updatedAt: null }];
      }
      profileId = name;
    } else {
      profileId = profileSelect.value;
    }

    try {
      localStorage.setItem(PROFILE_KEY, profileId);
    } catch (err) {
      // A browser that will not remember it still uses it for this session.
    }
    renderProfileSelect();
    await loadProfileEntries();
    renderPanel();
    renderWindowBanner();
    // The panel's rows are whose profile the *next* turn will use, so they
    // follow the picker rather than waiting for a turn to prove it.
    await refreshPanel();
  });

  /**
   * Which projects have rules — the second picker, built from the store.
   *
   * Same discipline as the profile list: it comes from the thing that owns it,
   * never from a second list here that can quietly disagree.
   */
  async function loadProjects() {
    try {
      const res = await fetch("/projects");
      if (res.ok) projects = (await res.json()).projects ?? [];
    } catch (err) {
      // A picker we cannot fill still has the project we are already on.
    }
    if (!projects.some((project) => project.id === projectId)) {
      projects = [...projects, { id: projectId, entryCount: 0, updatedAt: null }];
    }
    renderProjectSelect();
  }

  function renderProjectSelect() {
    projectSelect.innerHTML = "";
    for (const project of projects) {
      const option = document.createElement("option");
      option.value = project.id;
      option.textContent = project.id + (project.entryCount ? ` (${project.entryCount})` : "");
      projectSelect.appendChild(option);
    }
    const create = document.createElement("option");
    create.value = NEW_PROFILE;
    create.textContent = "New project\u2026";
    projectSelect.appendChild(create);
    projectSelect.value = projectId;
  }

  projectSelect.addEventListener("change", async () => {
    if (projectSelect.value === NEW_PROFILE) {
      const name = String(window.prompt("A name for the new project", "") ?? "").trim().toLowerCase();
      if (!/^[a-z0-9][a-z0-9_-]{0,63}$/.test(name)) {
        projectSelect.value = projectId;
        if (name) memoryNote("A project name is lowercase letters, digits, dash or underscore.");
        return;
      }
      // No file until a rule is written into it. An empty project is a
      // codebase nobody has stated a rule about yet, which is a real state.
      if (!projects.some((project) => project.id === name)) {
        projects = [...projects, { id: name, entryCount: 0, updatedAt: null }];
      }
      projectId = name;
    } else {
      projectId = projectSelect.value;
    }

    try {
      localStorage.setItem(PROJECT_KEY, projectId);
    } catch (err) {
      // A browser that will not remember it still uses it for this session.
    }
    // A draft belongs to the project it was typed against, so switching throws
    // it away rather than letting you accept a rule into the wrong codebase.
    invariantRows = [];
    renderProjectSelect();
    renderPanel();
    // The rules below belong to the project, so they change when the picker
    // does. Re-reading is what makes that true rather than leaving last
    // turn's snapshot on screen under a new project's name.
    await refreshPanel();
  });

  /**
   * The three-layer panel: profile, the task in hand, what was thrown away.
   *
   * Every row is addressable — *forget* on all of them, *promote* on the ones
   * the routing table marks promotable — and every button goes through the
   * same `applyOps` path on the server that the extractor's patch does. A
   * button that could change memory in a way a patch cannot express would be a
   * second code path with no test behind it.
   *
   * `interactive` is false where the panel is drawn inside the transcript, at
   * the context boundary: that copy is a caption, and a caption with buttons
   * in it is a trap.
   */
  function renderMemoryInto(target, panel, { interactive = true } = {}) {
    target.innerHTML = "";
    const root = document.createElement("div");
    root.className = "memory";

    // **First, because that is where it is on the wire and because it outranks
    // everything under it.** The panel's job is to make the payload legible,
    // and a section drawn below the profile would say the opposite of what the
    // precedence line in the block says.
    //
    // The caption copy drawn inside the transcript leaves it out when there
    // are no rules: the panel's empty state is an invitation to write one, and
    // an invitation in a caption is a button you cannot press.
    if (interactive || panel.invariants?.length) {
      root.appendChild(memoryInvariants(panel, interactive));
    }

    const profileLayer = memoryLayer({
      title: "Profile",
      lifetime: interactive ? `never expires · ${profileId}` : "never expires",
      rows: panel.profile ?? [],
      prefix: "profile:",
      empty: interactive
        ? `Nothing has been sent from ${profileId} on this branch yet. The editor below shows what it holds.`
        : "Nothing about you has been kept yet.",
      actions: interactive
        ? (row) => [actButton("forget", () => memoryOps([{ op: "delete", key: row.key, from: "profile" }]))]
        : null,
    });

    // The rows above are what was *sent* on the last turn of this branch. If
    // the picker has moved since, they are the other profile's — saying so is
    // cheaper than silently relabelling them, and a panel that quietly shows
    // one profile's entries under another profile's name is the exact bug the
    // picker makes possible.
    if (interactive && panel.user && panel.user !== profileId) {
      const moved = document.createElement("div");
      moved.className = "none";
      moved.textContent =
        `Above: what was sent last turn, as ${panel.user}. The next turn will use ${profileId}.`;
      profileLayer.appendChild(moved);
    }
    if (interactive) {
      profileLayer.appendChild(profileEditor());
      // Beside the editor rather than down with the numbers: comparing
      // profiles is an action on the profile store, and it has to be reachable
      // before a single turn has been taken — which is exactly when you most
      // want to know whether these two profiles actually answer differently.
      // The caption copy drawn inside the transcript gets neither, because a
      // caption with buttons in it is a trap.
      profileLayer.appendChild(compareButton());
    }
    root.appendChild(profileLayer);

    const task = memoryLayer({
      title: "Current task",
      lifetime: "cleared when it reaches done",
      rows: panel.task ?? [],
      prefix: "task:",
      empty: "No keys yet — whatever you say next fills this in.",
      actions: interactive
        ? (row) => [
            row.promotable
              ? actButton("promote", () => memoryOps([{ op: "promote", key: row.key }]))
              : null,
            actButton("forget", () => memoryOps([{ op: "delete", key: row.key, from: "working" }])),
          ].filter(Boolean)
        : null,
      // The stage goes above the keys here for the same reason it goes above
      // them in the block: it is the thing that says how to read the rest.
      // The buttons are not repeated — they live in the strip, where they are
      // visible without opening this panel.
      lead: panel.lifecycle ? stageSummary(panel.lifecycle) : null,
    });
    // **Why the reply you just read is not in here yet.**
    //
    // Memory is extracted before the model answers, over the exchange ending
    // with the message you sent — which is what makes a preference stated now
    // shape the answer now, and what leaves anything the *assistant* says one
    // turn behind. The case that reads as a bug is planning: it asks six
    // questions and the task shows nothing open until you say something else.
    // There is no second call to close that with, so it is said out loud.
    if (interactive && panel.lifecycle?.stage === "planning" && panel.reads?.pending) {
      const lag = document.createElement("div");
      lag.className = "none";
      lag.textContent =
        "The reply above has not been read into memory yet — that happens on your next message. " +
        "Anything it asked shows up here then, as open.* questions.";
      task.appendChild(lag);
    }
    root.appendChild(task);

    if (panel.lifecycle?.brief?.status === "accepted") root.appendChild(memoryBrief(panel.lifecycle.brief));
    if (panel.proposals?.length) root.appendChild(memoryProposals(panel.proposals, interactive));
    if (panel.pastTasks?.length) root.appendChild(memoryPastTasks(panel.pastTasks));
    if (panel.discarded?.length) root.appendChild(memoryDiscarded(panel.discarded));
    if (panel.digest?.text) root.appendChild(memoryDigest(panel.digest));
    if (panel.usage) root.appendChild(memorySpend(panel.usage));

    target.appendChild(root);
  }


  /**
   * **The rules, the box you type them in, and what was refused under them.**
   *
   * Three things in one section because they are one loop: you read what the
   * project already has, you type what else is true, and you see what the
   * assistant turned down because of it. Splitting them would mean the rules
   * you already have are somewhere other than the box where you would retype
   * them, which is how people end up with four rows saying the same thing.
   */
  function memoryInvariants(panel, interactive) {
    const rows = panel.invariants ?? [];
    const section = document.createElement("div");
    section.className = "layer rules";

    const heading = document.createElement("h3");
    heading.textContent = `Invariants (${rows.length})`;
    const life = document.createElement("span");
    life.className = "lifetime";
    life.textContent = interactive
      ? `the project's, not yours · ${panel.project ?? projectId}`
      : "the project's, not yours";
    heading.appendChild(life);
    section.appendChild(heading);

    if (!rows.length) {
      const none = document.createElement("div");
      none.className = "none";
      none.textContent = interactive
        ? "No rules yet. Anything you write here is sent on every turn, in every stage, above everything else in memory."
        : "No rules for this project.";
      section.appendChild(none);
    }

    for (const row of rows) {
      const entry = document.createElement("div");
      entry.className = "rule-row";

      const key = document.createElement("div");
      key.className = "k";
      key.textContent = row.subject || row.key;
      if (row.amended) {
        const flag = document.createElement("span");
        flag.className = "origin";
        flag.textContent = " · amended";
        flag.title =
          "This rule has been changed. Every sentence it has had is kept below — an " +
          "invariant that changed without a trace is worse than not having one.";
        key.appendChild(flag);
      }

      const value = document.createElement("div");
      value.className = "v";
      value.textContent = row.text;

      const check = document.createElement("span");
      check.className = "check";
      check.textContent = "check: " + row.check;

      entry.append(key, value, check);

      // What it used to say. This is the amendment path made visible: the value
      // of the mechanism is that it is stable, so every change stays readable.
      for (const old of row.previous ?? []) {
        const was = document.createElement("span");
        was.className = "was";
        was.textContent = "was: " + old.text;
        entry.appendChild(was);
      }

      // **The refusals, on the rule that caused them.** This is the artefact
      // the whole feature exists to produce: "what happens when a request
      // conflicts" becomes a line you can point at rather than a paragraph
      // somebody has to go and find in the transcript.
      for (const refusal of row.refusals ?? []) {
        entry.appendChild(refusalRow(refusal));
      }

      if (interactive) {
        const acts = document.createElement("div");
        acts.className = "acts";
        acts.appendChild(
          actButton("forget", () => {
            if (!confirm(`Withdraw "${row.text}"?\n\nIt stops being sent from the next turn. The wording is kept.`)) return;
            memoryOps([{ op: "delete", key: row.key }]);
          })
        );
        entry.appendChild(acts);
      }
      section.appendChild(entry);
    }

    // Refusals citing a rule this project no longer has. Kept rather than
    // dropped: "we turned that down under a rule we have since changed" is
    // exactly the thing worth being able to find afterwards.
    for (const refusal of panel.orphanRefusals ?? []) {
      const orphan = refusalRow(refusal);
      orphan.append(document.createTextNode(" "));
      const gone = document.createElement("span");
      gone.className = "alt";
      gone.textContent = `— ${refusal.invariant} is no longer a rule of this project`;
      orphan.appendChild(gone);
      section.appendChild(orphan);
    }

    if (interactive) section.appendChild(invariantAuthor());
    return section;
  }

  function refusalRow(refusal) {
    const box = document.createElement("div");
    box.className = "refusal";
    const lead = document.createElement("b");
    lead.textContent = "refused: ";
    box.append(lead, refusal.request);

    if (refusal.alternative) {
      const alt = document.createElement("span");
      alt.className = "alt";
      alt.textContent = "offered instead: " + refusal.alternative;
      box.appendChild(alt);
    } else {
      // **A dead end is a bad refusal.** Saying nothing here would hide the
      // one thing worth noticing: the rule was applied and nothing was offered
      // in its place, which is the shape of refusal people route around.
      const dead = document.createElement("span");
