      dead.className = "dead";
      dead.textContent = "nothing was offered in its place — the rule can be amended above";
      box.appendChild(dead);
    }
    return box;
  }

  /**
   * **Typed prose in, structured proposals out.**
   *
   * The button is the whole design. This costs a model call, and a cost you
   * did not press is a cost you press four times by accident — so nothing here
   * rides on a turn, and the draft it produces is a proposal that writes
   * nothing until a row is accepted. That accept is what keeps the namespace
   * person-only: the model drafts, you decide, and your click is the write.
   */
  function invariantAuthor() {
    const box = document.createElement("details");
    box.className = "editor";
    box.open = invariantRows.length > 0;
    const label = document.createElement("summary");
    label.textContent = "Write a rule";
    box.appendChild(label);

    const field = document.createElement("textarea");
    field.rows = 3;
    field.value = invariantDraft;
    field.placeholder = "we're never moving off Postgres, no ORM, deploys go through CI only";
    field.addEventListener("input", () => { invariantDraft = field.value; });
    box.appendChild(field);
    hint(
      box,
      "One sentence per rule is enough — three rules in one sentence comes back as three rows. " +
        "Nothing is written until you accept a row."
    );

    const propose = document.createElement("button");
    propose.type = "button";
    propose.className = "finish";
    propose.textContent = "Propose";
    propose.disabled = pending;
    propose.title = "One model call. It drafts; nothing is written until you accept a row.";
    propose.addEventListener("click", () => {
      if (pending) return;
      invariantDraft = field.value;
      proposeInvariants(field.value);
    });
    box.appendChild(propose);

    for (const row of invariantRows) box.appendChild(invariantDraftRow(row));
    return box;
  }

  /**
   * One drafted row, fully editable before it is accepted.
   *
   * Key, text and check are all inputs, because the model is guessing at all
   * three and this is the last moment anybody will look. Accept and reject are
   * per row rather than all-or-nothing: three rules came out of one sentence,
   * and two of them being right is the common case.
   */
  function invariantDraftRow(row) {
    const box = document.createElement("div");
    box.className = "proposal draft";

    const head = document.createElement("div");
    head.className = "row-key";
    const tag = document.createElement("span");
    tag.className = "tag " + row.action;
    tag.textContent = row.action;
    tag.title =
      row.action === "amend"
        ? "This subject already has a rule. Accepting replaces it and keeps the old wording."
        : row.action === "reject"
          ? "No usable check could be written for this, so it is not an invariant."
          : "Nothing is stored for this subject yet.";
    head.append(tag, row.key);
    box.appendChild(head);

    // **A rejection is a row, not a silence.** It says why, and it offers the
    // place the thing does belong — otherwise the only signal is a rule that
    // quietly did not appear.
    if (row.action === "reject") {
      const why = document.createElement("div");
      why.className = "was";
      why.textContent = row.reason || "this is a preference, not an invariant";
      box.appendChild(why);

      if (row.suggest) {
        const suggestion = document.createElement("div");
        suggestion.className = "v";
        suggestion.textContent = `${row.suggest.key}: ${row.suggest.value}`;
        box.appendChild(suggestion);

        const acts = document.createElement("div");
        acts.className = "acts";
        acts.append(
          actButton("keep it as that", () => {
            drop(row);
            memoryOps([{ op: "set", key: row.suggest.key, value: row.suggest.value }], { declared: true });
          }),
          actButton("discard", () => { drop(row); renderPanel(); })
        );
        box.appendChild(acts);
      } else {
        const acts = document.createElement("div");
        acts.className = "acts";
        acts.appendChild(actButton("discard", () => { drop(row); renderPanel(); }));
        box.appendChild(acts);
      }
      return box;
    }

    // An amendment shows what it replaces, so the box can be read as a diff
    // rather than as a rule appearing from nowhere on top of another one.
    if (row.current) {
      const was = document.createElement("div");
      was.className = "was";
      was.textContent = "replaces: " + row.current;
      box.appendChild(was);
    }

    const keyInput = ruleField(box, row.key, "invariant.database");
    const textInput = ruleField(box, row.text, "Stays on Postgres.");
    const checkInput = ruleField(box, row.check, "any proposal introducing another engine");

    // **Collisions are reported, never resolved.** These are the entries
    // already in memory on this subject. Nothing here decides between them —
    // accepting the rule sweeps them into proposals of their own, and you
    // answer those one at a time.
    for (const collision of row.collisions ?? []) {
      const clash = document.createElement("div");
      clash.className = "was";
      clash.textContent = `already on this subject — ${collision.key}: ${collision.value}`;
      box.appendChild(clash);
    }

    const acts = document.createElement("div");
    acts.className = "acts";
    acts.append(
      actButton(row.action === "amend" ? "amend it" : "accept", () => {
        const key = keyInput.value.trim().toLowerCase();
        const text = textInput.value.trim();
        const check = checkInput.value.trim();
        if (!key || !text || !check) return memoryNote("A rule needs a key, a sentence and a check.");
        drop(row);
        // The accept is the write, and it goes through `/memory/ops` like
        // everything else — one write path, marked as coming from a person.
        memoryOps([{ op: "set", key, value: text, check, supersedes: row.supersedes ?? undefined }]);
      }),
      actButton("discard", () => { drop(row); renderPanel(); })
    );
    box.appendChild(acts);
    return box;
  }

  function ruleField(parent, value, placeholder) {
    const field = document.createElement("input");
    field.value = value ?? "";
    field.placeholder = placeholder;
    parent.appendChild(field);
    return field;
  }

  /** Answering a row takes it out of the box. Unanswered ones stay. */
  function drop(row) {
    invariantRows = invariantRows.filter((other) => other !== row);
  }

  /**
   * The one new model call in the whole feature, and it fires here.
   *
   * A failure leaves the typed text where it is and writes nothing — there is
   * no partial result to half-apply, because nothing is applied until a row is
   * accepted.
   */
  async function proposeInvariants(text) {
    if (!text.trim()) return memoryNote("Type the rules first — one sentence each is enough.");
    setPending(true);
    try {
      const res = await fetch(`/conversations/${sessionId}/memory/invariants/propose`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ branchId, profile: profileId, project: projectId, text }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        memoryNote(data.error || `Could not draft the rules (${res.status}).`);
        return;
      }
      invariantRows = data.rows ?? [];
      panelState = data.panel ?? panelState;
      renderPanel();
      if (data.note) memoryNote(data.note);
      flashPanel();
    } catch (err) {
      memoryNote("Could not reach the server.");
    } finally {
      setPending(false);
    }
  }

  /**
   * The profile editor: the fields that had nowhere durable to live.
   *
   * It writes through the **same** `/memory/ops` route the panel's *forget*
   * and *promote* buttons use, with one extra flag saying the sentences came
   * from a person. That flag is the whole of what `declared` means, and a form
   * with its own endpoint would be a second write path into long-term memory
   * with no test behind it.
   *
   * There is no proposal step here and there should not be: a proposal is a
   * question addressed to you, and you are the one typing.
   */
  function profileEditor() {
    const box = document.createElement("details");
    box.className = "editor";
    const label = document.createElement("summary");
    label.textContent = `Edit ${profileId}`;
    box.appendChild(label);

    const valueOf = (key) => profileEntries.find((entry) => entry.key === key)?.value ?? "";
    const rules = profileEntries.filter((entry) => entry.key.startsWith("rule."));
    const rest = profileEntries.filter(
      (entry) => !entry.key.startsWith("rule.") && entry.key !== "preference.style" && entry.key !== "preference.format"
    );

    const style = field(box, "Style — how to talk to you", valueOf("preference.style"), "Terse. Assume I know the basics.");
    const format = field(box, "Format — what an answer looks like", valueOf("preference.format"), "Bullets, code first, under ten lines.");

    const rulesField = field(
      box,
      "Rules — one per line, absolute",
      rules.map((entry) => entry.value).join("\n"),
      "Never use em-dashes",
      3
    );
    const learned = rules.filter((entry) => entry.source !== "declared").length;
    hint(
      box,
      learned
        ? `${learned} of these was learned from a conversation — saving declares it, and the extractor stops being able to overwrite it.`
        : "Saving declares these. A model may then propose a change, but may not make one."
    );

    // Free-form, for everything that is not style, format or a rule. The keys
    // are the same keys the extractor uses, because there is one namespace and
    // one routing table, not a separate vocabulary for the form.
    const pairs = document.createElement("div");
    const label2 = document.createElement("label");
    label2.textContent = "Anything else — key and value";
    box.append(label2, pairs);
    for (const entry of rest) pairs.appendChild(pairRow(entry.key, entry.value));
    pairs.appendChild(pairRow("", ""));

    const add = document.createElement("button");
    add.type = "button";
    add.className = "act";
    add.textContent = "another";
    add.addEventListener("click", () => pairs.appendChild(pairRow("", "")));

    const save = document.createElement("button");
    save.type = "button";
    save.className = "finish";
    save.textContent = "Save to " + profileId;
    save.disabled = pending;
    save.addEventListener("click", () => {
      if (pending) return;
      const ops = declaredOps({ style: style.value, format: format.value, rulesText: rulesField.value, pairs, rest, ruleEntries: rules });
      if (!ops.length) return memoryNote("Nothing changed.");
      memoryOps(ops, { declared: true });
    });

    const acts = document.createElement("div");
    acts.className = "acts";
    acts.style.opacity = "1";
    acts.appendChild(add);
    box.append(acts, save);
    return box;
  }

  function field(parent, text, value, placeholder, rows = 0) {
    const label = document.createElement("label");
    label.textContent = text;
    const input = rows ? document.createElement("textarea") : document.createElement("input");
    if (rows) input.rows = rows;
    input.value = value;
    input.placeholder = placeholder;
    parent.append(label, input);
    return input;
  }

  function hint(parent, text) {
    const note = document.createElement("p");
    note.className = "hint";
    note.textContent = text;
    parent.appendChild(note);
  }

  function pairRow(key, value) {
    const row = document.createElement("div");
    row.className = "pair";
    const keyInput = document.createElement("input");
    keyInput.className = "key";
    keyInput.value = key;
    keyInput.placeholder = "profile.role";
    const valueInput = document.createElement("input");
    valueInput.className = "val";
    valueInput.value = value;
    valueInput.placeholder = "what is true about you";
    const remove = document.createElement("button");
    remove.type = "button";
    remove.title = "Clear this row — saving then forgets the key";
    remove.textContent = "×";
    remove.addEventListener("click", () => { valueInput.value = ""; });
    row.append(keyInput, valueInput, remove);
    return row;
  }

  /**
   * The form's contents as a patch — the same `{op, key, value}` shape the
   * extractor emits, because the UI must not be able to express a change the
   * patch format cannot.
   *
   * An emptied field is a `delete`, which is what makes the form able to take
   * something back. Long-term deletes are refused from a model and allowed
   * from a person, and this is a person.
   */
  function declaredOps({ style, format, rulesText, pairs, rest, ruleEntries }) {
    const ops = [];
    const held = new Map(profileEntries.map((entry) => [entry.key, entry.value]));

    for (const [key, text] of [["preference.style", style], ["preference.format", format]]) {
      const value = text.trim();
      if (value && value !== held.get(key)) ops.push({ op: "set", key, value });
      else if (!value && held.has(key)) ops.push({ op: "delete", key, from: "profile" });
    }

    // Rules are keyed by a slug of their own text, so the panel reads
    // `rule.never-use-em-dashes` rather than `rule.r3`. Editing a rule's
    // wording therefore moves it to a new key, and the old one is deleted —
    // which is why the deletes are computed from the keys that survived.
    const kept = new Set();
    const used = new Set();
    for (const line of rulesText.split("\n").map((text) => text.trim()).filter(Boolean)) {
      let key = "rule." + slug(line);
      let n = 2;
      while (used.has(key)) key = `rule.${slug(line)}-${n++}`;
      used.add(key);
      kept.add(key);
      if (held.get(key) !== line) ops.push({ op: "set", key, value: line });
    }
    for (const entry of ruleEntries) {
      if (!kept.has(entry.key)) ops.push({ op: "delete", key: entry.key, from: "profile" });
    }

    const seen = new Set();
    for (const row of pairs.querySelectorAll(".pair")) {
      const key = row.querySelector(".key").value.trim().toLowerCase();
      const value = row.querySelector(".val").value.trim();
      if (!key) continue;
      seen.add(key);
      if (value && value !== held.get(key)) ops.push({ op: "set", key, value });
      else if (!value && held.has(key)) ops.push({ op: "delete", key, from: "profile" });
    }
    for (const entry of rest) {
      if (!seen.has(entry.key)) ops.push({ op: "delete", key: entry.key, from: "profile" });
    }

    return ops;
  }

  /** `Never use em-dashes` → `never-use-em-dashes`, inside the key grammar. */
  function slug(text) {
    const words = text
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, " ")
      .trim()
      .split(" ")
      .filter(Boolean)
      .slice(0, 5)
      .join("-")
      .slice(0, 28)
      .replace(/-+$/, "");
    return /^[a-z0-9]/.test(words) ? words : "r" + (words || Date.now().toString(36));
  }

  /**
   * What memory costs, split by what is actually being paid for.
   *
   * The third row is the one that is easy to leave out, and the only one that
   * is charged on every turn whether or not memory did anything: the profile
   * block is not a call, it is input tokens in the turn's own request. It is
   * an estimate and it says so — measuring it exactly would mean a second
   * `count_tokens` round trip per turn to answer a question about proportions.
   */
  function memorySpend(usage) {
    const section = document.createElement("div");
    section.className = "layer";
    const heading = document.createElement("h3");
    heading.textContent = "What memory costs";
    const life = document.createElement("span");
    life.className = "lifetime";
    life.textContent = "this branch, so far";
    heading.appendChild(life);
    section.appendChild(heading);

    const table = document.createElement("div");
    table.className = "spend";
    const rows = [
      ["extraction", usage.overheadWorking, "calls"],
      ["the fold", usage.overheadSummary, "calls"],
      ["the profile block", usage.overheadProfile, "turns"],
    ];

    let any = false;
    for (const [name, bill, unit] of rows) {
      const count = bill?.[unit] ?? 0;
      if (!count) continue;
      any = true;
      const row = document.createElement("div");
      row.className = "row" + (bill.estimated ? " estimated" : "");
      const what = document.createElement("span");
      what.className = "what";
      what.textContent = `${name} · ${count} ${count === 1 ? unit.replace(/s$/, "") : unit}`;
      const num = document.createElement("span");
      num.className = "num";
      num.textContent =
        formatTokens((bill.inputTokens ?? 0) + (bill.outputTokens ?? 0)) +
        (bill.costUsd ? " · " + formatCost(bill.costUsd) : "");
      row.append(what, num);
      table.appendChild(row);
    }

    if (!any) {
      const none = document.createElement("div");
      none.className = "none";
      none.textContent = "Nothing spent yet.";
      table.appendChild(none);
    }
    section.appendChild(table);
    return section;
  }

  function memoryLayer({ title, lifetime, rows, prefix, empty, actions, lead = null }) {
    const section = document.createElement("div");
    section.className = "layer";

    const heading = document.createElement("h3");
    heading.textContent = `${title} (${rows.length})`;
    const life = document.createElement("span");
    life.className = "lifetime";
    life.textContent = lifetime;
    heading.appendChild(life);
    section.appendChild(heading);
    if (lead) section.appendChild(lead);

    if (!rows.length) {
      const none = document.createElement("div");
      none.className = "none";
      none.textContent = empty;
      section.appendChild(none);
      return section;
    }

    for (const row of rows) {
      const entry = document.createElement("div");
      entry.className = "entry" + (changedKeys.has(prefix + row.key) ? " changed" : "");

      const body = document.createElement("div");
      body.className = "body";
      const key = document.createElement("div");
      key.className = "k";
      key.textContent = row.key;
      if (row.rewrites) {
        // Drift is the failure this block cannot show by itself: every version
        // of a rewritten key looks right, because every version agrees with
        // whatever was said last.
        const churn = document.createElement("span");
        churn.className = "churn";
        churn.textContent = ` ⟲${row.rewrites}`;
        churn.title =
          `Overwritten ${row.rewrites} time${row.rewrites === 1 ? "" : "s"} since it was first established.`;
        key.appendChild(churn);
      }
      const value = document.createElement("div");
      value.className = "v";
      value.textContent = row.value;
      body.append(key, value);

      const was = changedKeys.has(prefix + row.key) ? row.previous?.[0] : null;
      if (was) {
        const before = document.createElement("span");
        before.className = "was";
        before.textContent = "was: " + was;
        body.appendChild(before);
      }
      if (row.source) {
        // Who decided this. `declared` means you wrote it in the form, and it
        // is the flag that makes the row untouchable by a model and immune to
        // being shadowed by the task in hand. `learned` means the extractor
        // proposed it and the routing table put it there, or you approved a
        // promotion — either way, nobody typed it. Long-term never expires, so
        // the difference is worth being able to see months later.
        const origin = document.createElement("span");
        origin.className = "origin";
        origin.textContent =
          row.source === "declared" ? " · you declared this" : " · learned from a conversation";
        key.appendChild(origin);
      }
      if (row.declared) entry.className += " declared";
      if (row.proposal) {
        // The correction, on the row it is about. One waiting in a list you
        // have to scroll to is one answered without looking at what it would
        // replace.
        const waiting = document.createElement("span");
        waiting.className = "pending";
        waiting.textContent =
          (row.proposal.reason === "frozen"
            ? "held back by the freeze: "
            : row.declared
              ? "the conversation suggests: "
              : "the task says: ") + row.proposal.value;
        body.appendChild(waiting);
      }
      if (row.governedBy) {
        // **A rule owns this subject.** The row is written — working memory
        // takes these rather than asking about each one — but it is outranked,
        // and saying so is what keeps the collision visible without turning it
        // into a question. Most of the time this is the task agreeing with the
        // rule; when it is not, both sentences are on screen together.
        const owned = document.createElement("span");
        owned.className = "origin";
        owned.textContent = " · " + row.governedBy + " outranks this";
        owned.title =
          "A project invariant owns this subject. It is sent above this row and outranks it; " +
          "if the two disagree, the agent is told to say so rather than quietly pick one.";
        key.appendChild(owned);
      }
      if (row.frozen) {
        // The task has been committed to, so this key is no longer freely
        // writable by a model. Marking it is the difference between "the
        // extractor stopped proposing a new goal" and "the extractor keeps
        // proposing one and the machine keeps refusing it".
        const lock = document.createElement("span");
        lock.className = "origin";
        lock.textContent = " · 🔒 frozen";
        lock.title =
          "Frozen when the task left planning. A model op on it becomes a correction " +
          "proposal; you can still change it yourself, and going back to planning thaws it.";
        key.appendChild(lock);
      }
      if (row.legacy) {
        entry.className += " contested legacy";
        const note = document.createElement("span");
        note.className = "was";
        note.textContent =
          "older key shape — anything new about you lands beside this, not over it";
        body.appendChild(note);
      }
      if (row.contested) {
        // The task in hand holds the same key with a different value. Which of
        // the two is on the wire is the whole difference declared makes: a
        // learned row loses to the more recent statement, a declared one does
        // not, because you wrote it down on purpose and the other half was
        // inferred from one exchange.
        entry.className += " contested";
        const flag = document.createElement("span");
        flag.className = "was";
        flag.textContent = row.sent
          ? "the current task contradicts this — you declared it, so it is still being sent"
          : "the current task contradicts this — not being sent";
        body.appendChild(flag);
      }

      entry.appendChild(body);
      if (actions) {
        const acts = document.createElement("div");
        acts.className = "acts";
        for (const button of actions(row)) acts.appendChild(button);
        entry.appendChild(acts);
      }
      section.appendChild(entry);
    }

    return section;
  }

  function actButton(label, onClick) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "act";
    button.textContent = label;
    button.disabled = pending;
    button.addEventListener("click", () => {
      if (pending) return;
      onClick();
    });
    return button;
  }

  /**
   * The stage, in the panel — read-only, and above the keys.
   *
   * Deliberately no buttons: the edges are in the strip, where they are
   * visible without opening a panel, and two sets of them would be two places
   * that can disagree about which edge is legal.
   */
  function stageSummary(life) {
    const box = document.createElement("div");
    box.className = "none";

    const stage = document.createElement("div");
    const lead = document.createElement("b");
    lead.textContent = "stage: " + life.stage;
    stage.appendChild(lead);
    if (life.step) stage.append(" · " + life.step);
    box.appendChild(stage);

    const actor = life.expectedAction?.actor === "agent" ? "the agent" : "you";
    const awaiting = document.createElement("div");
    awaiting.textContent =
      `awaiting: ${actor}` + (life.expectedAction?.what ? ` — ${life.expectedAction.what}` : "");
    box.appendChild(awaiting);

    // How it got here. Four entries of `execution → validation → execution`
    // say more about a task than any summary of it would.
    if (life.log?.length) {
      const route = document.createElement("div");
      route.className = "was";
      route.textContent =
        "route: " + [life.log[0].from, ...life.log.map((entry) => entry.to)].join(" → ");
      box.appendChild(route);
    }
    if (life.previous) {
      const previous = document.createElement("div");
      previous.className = "was";
      previous.textContent = "resumes the task closed before it";
      box.appendChild(previous);
    }
    return box;
  }

  function memoryProposals(proposals, interactive) {
    const section = document.createElement("div");
    section.className = "layer";
    const pending_ = proposals.filter((p) => p.status === "pending").length;

    const corrections = proposals.filter((p) => p.status === "pending" && p.kind === "correction").length;
    const heading = document.createElement("h3");
    heading.textContent = corrections
      ? `Waiting for you (${pending_})`
      : `Proposed for long-term (${pending_})`;
    const life = document.createElement("span");
    life.className = "lifetime";
    life.textContent = "nothing is written until you say so";
    heading.appendChild(life);
    section.appendChild(heading);

    for (const proposal of proposals) {
      const box = document.createElement("div");
      box.className = "proposal" + (proposal.status === "pending" ? "" : " answered");

      const key = document.createElement("div");
      key.className = "k";
      key.textContent =
        proposal.key +
        (proposal.kind === "correction" ? " · correction" : proposal.kind === "collision" ? " · collision" : "") +
        (proposal.status === "pending" ? "" : " · " + proposal.status);
      box.appendChild(key);

      // **Which rule refused this, what it says, and how you would know it had
      // been broken.** All three on the row, because a refusal whose reason
      // you cannot read is one you answer by clicking whichever button is
      // nearer — and one of these two buttons forgets something.
      if (proposal.invariant) {
        const rule = document.createElement("div");
        rule.className = "was";
        rule.textContent =
          (proposal.kind === "collision"
            ? `${proposal.invariant} now owns this subject: `
            : `${proposal.invariant} says: `) + (proposal.rule ?? "");
        box.appendChild(rule);
        if (proposal.check) {
          const check = document.createElement("div");
          check.className = "was";
          check.textContent = "check: " + proposal.check;
          box.appendChild(check);
        }
      }

      if (proposal.was) {
        const stale = document.createElement("div");
        stale.className = "was";
        // Two different disagreements wear the same shape, and they do not
        // read the same. One is long-term going stale against the work in
        // hand; the other is the work in hand arguing with a goal that was
        // frozen when the task was committed to.
        stale.textContent =
          (proposal.reason === "frozen" ? "the goal is frozen at: " : "long-term still says: ") + proposal.was;
        box.appendChild(stale);
      }

      if (!interactive || proposal.status !== "pending") {
        const value = document.createElement("div");
        value.className = "v";
        value.textContent = proposal.value;
        box.append(value);
        section.appendChild(box);
        continue;
      }

      // Editable, because the rephrasing is the part most likely to be wrong
      // and this is the last moment anyone will look at it. A collision row is
      // the exception: it is not proposing new words, it is asking about words
      // that are already stored, so editing them would be a third thing the
      // two buttons might mean.
      const field = document.createElement("textarea");
      field.rows = 3;
      field.value = proposal.value;
      if (proposal.kind === "collision") field.readOnly = true;

      const acts = document.createElement("div");
      acts.className = "acts";
      // **A collision asks the opposite question**, so its buttons say the
      // opposite words. A correction asks *should this say the new thing?* and
      // approving writes it. A collision asks *a rule owns this subject now;
      // does this entry still belong?* and approving forgets it. One pair of
      // labels for both would be two meanings behind one word.
      const yes =
        proposal.kind === "collision"
          ? "forget it"
          : proposal.kind === "correction"
            ? proposal.reason === "invariant"
              ? "write it anyway"
              : "update it"
            : "keep it";
      const no =
        proposal.kind === "collision"
          ? "keep it"
          : proposal.kind === "correction"
            ? "leave it"
            : "discard";
      acts.append(
        actButton(yes, () =>
          memoryRequest(`proposals/${encodeURIComponent(proposal.id)}`, {
            action: "approve",
            value: field.value,
          })
        ),
        actButton(no, () =>
          memoryRequest(`proposals/${encodeURIComponent(proposal.id)}`, { action: "reject" })
        )
      );

      box.append(field, acts);
      section.appendChild(box);
    }

    return section;
  }

  /**
   * The accepted brief, in the panel.
   *
   * It sits with the layers rather than with the digest because it is not a
   * compression of what was said — it is the agreed statement of what the work
   * *is*, and the only reason the planning messages can be left off the wire.
   */
  function memoryBrief(brief) {
    const section = document.createElement("div");
    section.className = "layer";
    const heading = document.createElement("h3");
    heading.textContent = "The brief";
    const life = document.createElement("span");
    life.className = "lifetime";
    life.textContent =
      `stands in for ${brief.through} message${brief.through === 1 ? "" : "s"}` + (brief.edited ? " · you edited it" : "");
    heading.appendChild(life);
    section.appendChild(heading);

    const block = document.createElement("details");
    block.className = "past";
    const label = document.createElement("summary");
    label.textContent = "what execution is working from";
    const body = document.createElement("div");
    body.className = "digest";
    body.textContent = brief.text;
    body.style.whiteSpace = "pre-wrap";
    block.append(label, body);
    section.appendChild(block);
    return section;
  }

  /** Cleared, not deleted: a closed task is still here, it just stops being sent. */
  function memoryPastTasks(tasks) {
    const section = document.createElement("div");
    section.className = "layer";

    const heading = document.createElement("h3");
    heading.textContent = `Past tasks (${tasks.length})`;
    const life = document.createElement("span");
    life.className = "lifetime";
    life.textContent = "kept, not sent";
    heading.appendChild(life);
    section.appendChild(heading);

    for (const task of [...tasks].reverse()) {
      const block = document.createElement("details");
      block.className = "past";
      const label = document.createElement("summary");
      label.textContent =
        `closed after turn ${task.turn} · ${task.stage ?? "closed"} · ` +
        `${task.entries.length} entr${task.entries.length === 1 ? "y" : "ies"}` +
        (task.promoted ? ` · ${task.promoted} promoted` : "");
      block.appendChild(label);

      // The route it took to get there, which is the part worth reading later:
      // a task that went through validation twice was a different piece of
      // work from one that went straight through.
      if (task.transitions?.length) {
        const route = document.createElement("div");
        route.className = "discarded";
        route.textContent =
          [task.transitions[0].from, ...task.transitions.map((entry) => entry.to)].join(" → ");
        block.appendChild(route);
      }

      if (task.brief) {
        // Of everything a closed task leaves behind this is the most readable,
        // and "what was that one about?" is answered by it and nothing else.
        const brief = document.createElement("div");
        brief.className = "digest";
        brief.style.whiteSpace = "pre-wrap";
        brief.textContent = task.brief;
        block.appendChild(brief);
      }

      for (const entry of task.entries) {
        const row = document.createElement("div");
        row.className = "entry";
        const body = document.createElement("div");
        body.className = "body";
        const key = document.createElement("div");
        key.className = "k";
        key.textContent = entry.key;
        const value = document.createElement("div");
        value.className = "v";
        value.textContent = entry.value;
        body.append(key, value);
        row.appendChild(body);
        block.appendChild(row);
      }
      section.appendChild(block);
    }

    return section;
  }

  /**
   * What the extractor proposed and the routing table refused.
   *
   * Without this line, a key discarded for having a namespace nobody
   * recognises looks exactly like an extraction that found nothing — and the
   * two call for opposite fixes.
   */
  function memoryDiscarded(rows) {
    const section = document.createElement("div");
    section.className = "layer";
    const heading = document.createElement("h3");
    heading.textContent = "Proposed, not stored";
    section.appendChild(heading);

    for (const row of [...rows].reverse()) {
      const line = document.createElement("div");
      line.className = "discarded";
      const code = document.createElement("code");
      // A row with no key has an op and nothing else, and that op is the whole
      // of what went wrong — printing "(no key)" and stopping described every
      // malformed patch identically.
      code.textContent = row.key === "(no key)" && row.op ? `op: ${row.op}` : row.key;
      line.append(code, ` — ${row.reason}`);
      // What it would have stored. A refusal you cannot read is one you cannot
      // judge: the whole point of showing this list is that you can tell a key
      // worth rescuing by hand from one that was never worth keeping.
      if (row.value) {
        const dropped = document.createElement("span");
        dropped.className = "was";
        dropped.textContent = "dropped: " + row.value;
        line.appendChild(dropped);
      }
      section.appendChild(line);
    }
    return section;
  }

  /** The digest is compressed short-term, not a fourth layer — so it is last. */
  function memoryDigest(digest) {
    const section = document.createElement("div");
    section.className = "layer";
    const heading = document.createElement("h3");
    heading.textContent = "Digest";
    const life = document.createElement("span");
    life.className = "lifetime";
    life.textContent = `covers ${digest.covers} message${digest.covers === 1 ? "" : "s"}`;
    heading.appendChild(life);
    section.appendChild(heading);

    const block = document.createElement("details");
    block.className = "past";
    const label = document.createElement("summary");
    label.textContent = "what was discussed, compressed";
    const body = document.createElement("div");
    body.className = "digest";
    renderSummaryInto(body, digest.text);
    block.append(label, body);
    section.appendChild(block);
    return section;
  }

  // ---- the comparison ------------------------------------------------------

  /**
   * **Same message, same history, N profiles, side by side.**
   *
   * The evidence that personalization is doing anything, and the only kind
   * available: two profiles answering the same question differently. Nothing
   * here asks the model which preferences it used, because it would make that
   * up — what it shows instead is the block that went in and the answer that
   * came back, three times each.
   */
  function compareButton() {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "finish";
    button.textContent = "Compare profiles";
    button.title = "Ask the same question as two different people. Nothing is written.";
    button.addEventListener("click", openCompare);
    return button;
  }

  function openCompare() {
    // A question worth comparing is usually the one already typed, or the last
    // one asked. Either beats an empty box.
    const lastUser = [...messages.querySelectorAll(".row.user .bubble")].at(-1);
    compareMessage.value = input.value.trim() || lastUser?.textContent?.trim() || "";

    if (!compareWith.size) {
      compareWith = new Set([profileId, ...profiles.map((p) => p.id).filter((id) => id !== profileId)].slice(0, 2));
    }
    renderCompareSetup();
    compareResults.innerHTML = '<p class="placeholder">Pick two or more profiles and run it.</p>';
    compareFoot.textContent = "";
    compareDialog.showModal();
  }

  function renderCompareSetup() {
    compareWho.innerHTML = "";
    for (const profile of profiles) {
      const label = document.createElement("label");
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = compareWith.has(profile.id);
      box.addEventListener("change", () => {
        if (box.checked) compareWith.add(profile.id);
        else compareWith.delete(profile.id);
      });
      label.append(box, profile.id + (profile.entryCount ? ` (${profile.entryCount})` : ""));
      compareWho.appendChild(label);
    }

    const spacer = document.createElement("span");
    spacer.className = "spacer";

    const samples = document.createElement("label");
    const select = document.createElement("select");
    for (const n of [1, 2, 3, 4, 5]) {
      const option = document.createElement("option");
      option.value = String(n);
      option.textContent = `${n} run${n === 1 ? "" : "s"} each`;
      if (n === 3) option.selected = true;
      select.appendChild(option);
    }
    samples.appendChild(select);

    const run = document.createElement("button");
    run.type = "button";
    run.textContent = "Run";
    run.addEventListener("click", () => runCompare(Number(select.value)));

    compareWho.append(spacer, samples, run);
  }

  async function runCompare(samples) {
    const message = compareMessage.value.trim();
    if (!message) return void (compareNote.textContent = "Type the question first.");
    if (compareWith.size < 2) return void (compareNote.textContent = "Pick at least two profiles.");

    compareNote.textContent = `Running ${compareWith.size * samples} turns…`;
    compareResults.innerHTML = '<p class="placeholder">Running…</p>';
    compareFoot.textContent = "";

    try {
      const res = await fetch(`/conversations/${sessionId}/memory/compare`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          branchId,
          message,
          profiles: [...compareWith],
          samples,
          contextMessages: Number(contextInput.value),
          maxTokens: Number(maxTokensSelect.value),
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        compareResults.innerHTML = "";
        compareResults.appendChild(placeholder(data.error || `The comparison failed (${res.status}).`));
        return;
      }
      renderCompare(data);
    } catch (err) {
      compareResults.innerHTML = "";
      compareResults.appendChild(placeholder("Could not reach the server."));
    } finally {
      compareNote.textContent =
        "Read-only: nothing here is written to a profile or to this conversation.";
    }
  }

  function renderCompare(data) {
    compareResults.innerHTML = "";
    for (const arm of data.arms ?? []) {
      const column = document.createElement("div");
      column.className = "arm";

      const name = document.createElement("h3");
      name.textContent = arm.user;
      const who = document.createElement("div");
      who.className = "who";
      who.textContent =
        `${arm.entryCount} entr${arm.entryCount === 1 ? "y" : "ies"}, ${arm.declaredCount} declared · ` +
        `${formatTokens(arm.usage.inputTokens + arm.usage.outputTokens)} tokens · ${formatCost(arm.usage.costUsd)}`;
      column.append(name, who);

      // What actually went in. The claim is structural, so the payload is part
      // of the result rather than a debugging aid tucked away somewhere.
      if (arm.runs[0]?.profileBlock) {
        const block = document.createElement("details");
        const label = document.createElement("summary");
        label.textContent = "what was sent";
        const pre = document.createElement("pre");
        pre.textContent = arm.runs[0].profileBlock;
        block.append(label, pre);
        column.appendChild(block);
      }

      for (const run of arm.runs) {
        const box = document.createElement("div");
        box.className = "run";
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = `run ${run.run}` + (run.ok ? "" : " — failed");
        const body = document.createElement("div");
        body.className = "body";
        body.textContent = run.ok ? run.reply : run.error;
        box.append(label, body);
        column.appendChild(box);
      }

      compareResults.appendChild(column);
    }

    const meta = data.meta ?? {};
    compareFoot.textContent =
      `${meta.calls ?? 0} calls · ${formatTokens((meta.inputTokens ?? 0) + (meta.outputTokens ?? 0))} tokens · ` +
      `${formatCost(meta.costUsd)} · ${((meta.ms ?? 0) / 1000).toFixed(1)}s — billed to this comparison and to nothing ` +
      "else. No ops were applied, no digest folded, and neither the profiles nor this conversation were written to.";
  }

  function placeholder(text) {
    const node = document.createElement("p");
    node.className = "placeholder";
    node.textContent = text;
    return node;
  }

  document.getElementById("compare-close").addEventListener("click", () => compareDialog.close());

  /** `forget`, `promote` and the editor's Save — all of it as one patch. */
  function memoryOps(ops, { declared = false, acknowledged = [] } = {}) {
    return memoryRequest("ops", { ops, declared, acknowledged });
  }

  /**
   * Every memory action is the same request: post it, take the panel that
   * comes back as the new truth, and redraw. The server answers with the whole
   * panel rather than with what changed, so the page can never hold a view of
   * memory that the store disagrees with.
   */
  async function memoryRequest(path, body) {
    setPending(true);
    try {
      const res = await fetch(`/conversations/${sessionId}/memory/${path}`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ branchId, profile: profileId, project: projectId, ...body }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        memoryNote(data.error || `Could not change memory (${res.status}).`);
        return;
      }
      // Anything that can change long-term memory can change what the editor
      // should be showing, so its copy is re-read rather than patched. One
      // round trip on a button press, against a form that silently disagrees
      // with the store.
      await loadProfileEntries();
      panelState = data.panel ?? panelState;
      diffMemory(panelState);
      renderPanel();
      renderWindowBanner();
      // A transition adds a line to the log, and the log is what the dividers
      // are drawn from — so the one that was just clicked appears at the
      // bottom of the transcript immediately rather than on the next reload.
      markTransitions(panelState.lifecycle);
      markContextBoundary(windowState.droppedCount);
      if (data.note) memoryNote(data.note);
      flashPanel();
    } catch (err) {
      memoryNote("Could not reach the server.");
    } finally {
      setPending(false);
    }
  }

  /** One line under the panel's heading, for what just happened to memory. */
  function memoryNote(text) {
    const line = document.createElement("div");
    line.className = "none";
    line.textContent = text;
    panelBody.prepend(line);
  }

  function panelPlaceholder() {
    const node = document.createElement("div");
    node.className = "placeholder";
    node.textContent = panelState.note || "Nothing to show yet.";
    return node;
  }

  /** `Known facts · 7 facts · 3 namespaces`, or the summary's own headline. */
  function panelHeadline(panelState = panelView()) {
    if (panelState.kind === "memory") {
      const profile = panelState.profile?.length ?? 0;
      const task = panelState.task?.length ?? 0;
      const waiting = (panelState.proposals ?? []).filter((p) => p.status === "pending").length;
      const rules = panelState.invariants?.length ?? 0;
      const parts = [
        rules ? `${rules} invariant${rules === 1 ? "" : "s"}` : null,
        `${profile} in profile`,
        `${task} in this task`,
        panelState.digest?.text ? "digest" : null,
        waiting ? `${waiting} to approve` : null,
      ].filter(Boolean);
      return parts.join(" · ");
    }
    if (panelState.kind === "facts") {
      const count = panelState.facts?.length ?? 0;
      if (!count) return "nothing established yet";
      const namespaces = new Set(panelState.facts.map((f) => f.namespace)).size;
      return `${count} fact${count === 1 ? "" : "s"} · ${namespaces} namespace${namespaces === 1 ? "" : "s"}` +
        (changedKeys.size ? ` · ${changedKeys.size} changed this turn` : "");
    }
    if (panelState.kind === "summary") {
      if (!panelState.text) return "nothing folded in yet";
      const parts = [`covers ${panelState.covers} message${panelState.covers === 1 ? "" : "s"}`];
      if (panelState.updatedAt) parts.push("updated " + relativeTime(panelState.updatedAt));
      return parts.join(" · ");
    }
    return "nothing rides along";
  }

  /**
   * What the panel should draw, which is not always what the server last sent.
   *
   * Every other strategy's panel describes something that only exists once a
   * turn has been taken — there is no summary before the first fold and no
   * facts before the first extraction, so "nothing yet" is the honest thing to
   * show. The profile is different in kind: it is long-term memory, it lives
   * outside every conversation, and it is there before this branch has said a
   * word. Making the form that edits it wait for a turn on one particular
   * strategy had it exactly backwards — you would have had to talk to the
   * assistant before you could tell it how to talk to you.
   *
   * So when the selector says `memory` and the branch has no memory state yet,
   * the panel is drawn from an empty one. The layers are empty because nothing
   * has been sent; the editor and the picker are not, because they are about
   * the store rather than about this turn.
   */
  /**
   * The panel to draw, and the placeholder for when there is not one yet.
   *
   * The fallback below is a **placeholder, not an answer**: it is what the
   * strip and the panel need in order to draw something true about a branch
   * the server has not described yet — the stage, and the one legal edge out
   * of it, both of which are knowable without asking. Its empty layers are
   * *unknown*, not *none*, which is why everything that changes what the
   * server would say — the strategy, the profile, the project — refetches
   * rather than settling for this.
   */
  function panelView() {
    if (panelState.kind === "memory") return panelState;
    if (strategySelect.value !== "memory") return panelState;
    return {
      kind: "memory",
      title: "Memory",
      user: null,
      project: null,
      invariants: [],
      orphanRefusals: [],
      // A conversation with no state is already in `planning` — there is no
      // null/no-task state, so the strip has something true to draw before a
      // word has been said. The one legal edge out is blocked, and the guard's
      // sentence is what the disabled button says.
      lifecycle: {
        id: null,
        previous: null,
        stage: "planning",
        stages: ["planning", "execution", "validation", "done"],
        step: "working out what the task is",
        expectedAction: { actor: "user", what: "say what the task is" },
        edges: [
          { to: "execution", allowed: false, reason: "Nothing is recorded as the goal yet — say what the task is first.", warning: null },
        ],
        suggestion: null,
        refused: [],
        log: [],
        frozen: [],
        updatedAt: null,
      },
      profile: [],
      task: [],
      proposals: [],
      pastTasks: [],
      discarded: [],
      digest: { text: null, covers: 0, updatedAt: null },
      usage: null,
      note: "Nothing is being carried yet — every block is omitted from the system prompt until it has something in it.",
    };
  }

  // ---- the stage strip -----------------------------------------------------

  /**
   * **Whose turn is it, before you type.**
   *
   * Four dots, the step line, the actor line and a button per legal edge — and
   * every one of them is read straight out of stored state. The buttons are
   * `TRANSITIONS` filtered by the current stage, which is why the UI cannot
   * offer an edge the machine does not have: there is no second list of them
   * here to fall out of step with the table.
   *
   * A disabled button carries the guard's own sentence as its tooltip. The
   * rule lives in `guardFor` and the tooltip is that function quoting itself,
   * so "why is this greyed out" has one answer rather than two that drift.
   */
  function renderStageStrip() {
    const view = panelView();
    const life = view.kind === "memory" ? view.lifecycle : null;
    if (!life) {
      // Only the memory strategy has a task. Showing a stage for one that does
      // not keep one would be inventing state, so the strip goes away.
      stageStrip.hidden = true;
      stageStrip.innerHTML = "";
      return;
    }

    stageStrip.hidden = false;
    stageStrip.innerHTML = "";

    const current = life.stages.indexOf(life.stage);
    const dots = document.createElement("div");
    dots.className = "stage-dots";
    life.stages.forEach((name, index) => {
      const dot = document.createElement("span");
      dot.className = "dot" + (index < current ? " past" : index === current ? " now" : "");
      dot.title = name;
      dots.appendChild(dot);
    });
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = life.stage;
    dots.appendChild(name);
    stageStrip.appendChild(dots);

    if (life.step) {
      const step = document.createElement("span");
      step.className = "step";
      const lead = document.createElement("span");
      lead.className = "lead";
      lead.textContent = "step: ";
      step.append(lead, life.step);
      stageStrip.appendChild(step);
    }

    const actor = life.expectedAction?.actor === "agent" ? "agent" : "user";
    const awaiting = document.createElement("span");
    awaiting.className = "awaiting " + actor;
    awaiting.textContent =
      `awaiting: ${actor === "agent" ? "the agent" : "you"}` +
      (life.expectedAction?.what ? ` — ${life.expectedAction.what}` : "");
    // There is no blocked state and there does not need to be: blocked is
    // `actor: 'user'`, said in a way the next turn can act on.
    //
    // The agent half has to say *and nothing has happened yet*. A transition
    // changes the instruction on the next reply; it does not produce one, and
    // an "awaiting: the agent" that reads as "the agent is doing it" earns
    // exactly one thing: three more clicks on the arrows while you wait.
    awaiting.title =
      actor === "user"
        ? "The work cannot go further until you say or do this."
        : "Nothing is running. Send a message — or press ▶ — and the reply comes back under this stage's instruction.";
    stageStrip.appendChild(awaiting);

    // **A pending brief is the only thing between planning and execution**, so
    // while one is waiting the strip stops offering anything else. Rendering
    // the arrows beside it would invite a click that skips the one step the
    // whole handoff exists for.
    if (life.brief?.status === "pending") {
      stageStrip.appendChild(briefEditor(life));
      return;
    }

    const edges = document.createElement("div");
    edges.className = "edges";

    // What the model thinks the next edge is — beside the button, and never
    // instead of it. It is told what stage it is in; it is not consulted.
    if (life.suggestion) {
      const chip = document.createElement("span");
      chip.className = "suggestion";
      chip.textContent = `the agent suggests → ${life.suggestion.to}`;
      chip.title = life.suggestion.reason || "No reason given. It changes nothing until you click.";
      edges.appendChild(chip);
    }

    const last = life.refused?.[life.refused.length - 1];
    if (last) {
      const refused = document.createElement("span");
      refused.className = "refused";
      refused.textContent = `refused: ${last.from} → ${last.to}`;
      refused.title = last.reason;
      edges.appendChild(refused);
    }

    for (const edge of life.edges ?? []) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = "→ " + edge.to;
      button.disabled = pending || !edge.allowed;
      // The warning case proceeds; only the guard blocks. The two must not
      // look alike, so one greys the button out and the other colours it.
      if (edge.warning) button.className = "warned";
      button.title = edge.allowed
        ? edge.warning
          ? edge.warning + " You can go ahead anyway."
          : `Move this task to ${edge.to}.`
        : edge.reason;
      if (life.suggestion?.to === edge.to) button.style.fontWeight = "600";
      button.addEventListener("click", () => {
        if (pending) return;
        // Warns, does not block. The open questions are named in the text, so
        // the choice is made looking at what is actually unanswered.
        if (edge.warning && !confirm(`${edge.warning}\n\nMove to ${edge.to} anyway?`)) return;
        memoryRequest("transition", { to: edge.to });
      });
      edges.appendChild(button);
    }

    // **The thing that makes a stage run rather than merely be set.**
    //
    // A transition changes the instruction on the next reply; it does not
    // produce one, because the agent only ever answers a message. So when the
    // stage is waiting on the agent, the strip offers to send that message —
    // and the message it sends is `expectedAction.what`, which is why that
    // field holds a sentence rather than a flag.
    //
    // It is a button of its own rather than something the arrows do quietly:
    // it costs a model call, and a cost you did not press is a cost you
    // press four times by accident.
    if (actor === "agent" && life.stage !== "done") {
      const go = document.createElement("button");
      go.type = "button";
      go.className = "go";
      go.textContent = "▶ let it continue";
      go.disabled = pending;
      go.title = `Send “${life.expectedAction.what}” as the next turn, under the ${life.stage} instruction.`;
      go.addEventListener("click", () => {
        if (pending) return;
        send(life.expectedAction.what);
      });
      edges.appendChild(go);
    }

    // `done` is terminal, so the only thing left is the successor task.
    if (!life.edges?.length && life.stage === "done") {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = "Start a new task";
      button.disabled = pending;
      button.title = "This one is closed for good. The new task records that it follows this one.";
      button.addEventListener("click", () => {
        if (pending) return;
        memoryRequest("new-task", {});
      });
      edges.appendChild(button);
    }

    stageStrip.appendChild(edges);
  }

  /**
   * The handoff, before it takes effect.
   *
   * Everything planning established is about to become these words and only
   * these words — the conversation above stops being sent the moment they are
   * accepted. So they are shown in a box you can type in, and execution starts
   * when you say the box is right. It is the same discipline as every other
   * write in this app: the model proposes, a person decides.
   */
  function briefEditor(life) {
    const box = document.createElement("div");
    box.className = "brief";

    const heading = document.createElement("div");
    heading.className = "head";
    const title = document.createElement("b");
    title.textContent = "The task, as understood";
    const hint = document.createElement("span");
    hint.textContent =
      " — everything above is replaced by this. Fix anything it got wrong before starting.";
    heading.append(title, hint);
    box.appendChild(heading);

    const field = document.createElement("textarea");
    field.rows = 12;
    field.value = life.brief.text;
    box.appendChild(field);

    /**
     * **What planning did not answer, about to become keys.**
     *
     * The brief has been saying this in prose all along, and prose is read
     * once and then gone: nothing downstream could see it, so the task held no
     * record of it and the edges that warn about unanswered questions had
     * nothing to read. These are the same questions in the form the machine
     * can keep, and accepting the brief is what writes them.
     *
     * Every one is droppable, because the box above is editable and you may
     * have just answered one in it.
     */
    const dropped = new Set();
    const questions = life.brief.open ?? [];
    if (questions.length) {
      const list = document.createElement("div");
      list.className = "open";
      const raised = questions.filter((row) => !row.recorded).length;
      const lead = document.createElement("div");
      lead.className = "head";
      lead.textContent =
        `${questions.length} question${questions.length === 1 ? "" : "s"} nobody answered — recorded with the task when you start` +
        (raised ? ` · ${raised} the brief is raising, not quoting` : "");
      list.appendChild(lead);

      for (const row of questions) {
        const item = document.createElement("div");
        item.className = "pair";
        const label = document.createElement("span");
        label.textContent = row.question;
        if (!row.recorded) {
          // **Planning did not write this one down.** A `Still open` heading
          // is a box, and a model asked to fill one will write the sensible
          // questions it *would* ask rather than the ones anybody did. Code
          // cannot tell those apart, so it says which ones were recorded and
          // leaves the judgement — and the × — to you.
          const flag = document.createElement("em");
          flag.textContent = " · not asked during planning";
          flag.title =
            "Planning recorded no open question matching this. The brief may be raising it " +
            "on its own — drop it unless it is something that genuinely went unanswered.";
          label.appendChild(flag);
        }
        const drop = document.createElement("button");
        drop.type = "button";
        drop.title = "Answered already, or not worth keeping — leave it out.";
        drop.textContent = "×";
        drop.addEventListener("click", () => {
          const off = dropped.has(row.key);
          off ? dropped.delete(row.key) : dropped.add(row.key);
          item.style.opacity = off ? "1" : "0.4";
          label.style.textDecoration = off ? "none" : "line-through";
        });
        item.append(label, drop);
        list.appendChild(item);
      }
      box.appendChild(list);
    }

    const acts = document.createElement("div");
    acts.className = "acts";

    const start = document.createElement("button");
    start.type = "button";
    start.className = "go";
    start.textContent = "start execution";
    start.disabled = pending;
    start.title = "Accept this brief, leave planning, and stop sending the conversation above it.";
    start.addEventListener("click", () => {
      if (pending) return;
      const keep = questions.filter((row) => !dropped.has(row.key));
      // **The last cheap moment.** Leaving planning freezes the goal and drops
      // the conversation off the wire, and these stop being things the agent
      // asks about. Saying so here is the whole reason the handoff waits for a
      // person rather than moving on the click.
      if (keep.length) {
        const list = keep.map((row) => "· " + row.question).join("\n");
        if (!confirm(`${keep.length} question${keep.length === 1 ? " is" : "s are"} still unanswered:\n\n${list}\n\nStart execution anyway? They will be recorded with the task.`)) return;
      }
      // Only what you pressed × on. Sending what to *keep* meant any mismatch
      // between this list and the server's silently recorded nothing.
      memoryRequest("brief", { action: "accept", text: field.value, drop: [...dropped] });
    });

    const back = document.createElement("button");
    back.type = "button";
    back.textContent = "keep planning";
    back.disabled = pending;
    back.title = "Throw this away and stay in planning. Nothing moves and nothing is dropped.";
    back.addEventListener("click", () => {
      if (pending) return;
      memoryRequest("brief", { action: "discard" });
    });

    acts.append(start, back);
    box.appendChild(acts);
    return box;
  }

  function renderPanel() {
    const view = panelView();
    panelStats.innerHTML = "";
    const label = document.createElement("b");
    label.textContent = view.title || "Context";
    panelStats.append(label, " ", panelHeadline(view));

    if (view.kind === "memory") {
      // Always drawn, even when every layer is empty: the sections are what
      // explain the three lifetimes, and the button that ends a task has to be
      // reachable before there is anything to show under it.
      renderMemoryInto(panelBody, view);
    } else if (view.kind === "facts" && view.facts?.length) {
      renderFactsInto(panelBody, view.facts);
    } else if (view.kind === "summary" && view.text) {
      renderSummaryInto(panelBody, view.text);
    } else {
      panelBody.innerHTML = "";
      panelBody.appendChild(panelPlaceholder());
    }

    renderStageStrip();
  }

  /**
   * Work out which facts moved, so the table can flash exactly those rows.
   * Done here rather than on the server because it is a property of what this
   * page last drew, not of what the conversation knows.
   */
  function diffFacts(facts) {
    changedKeys = new Set();
    for (const fact of facts ?? []) {
      // A key that was not there a moment ago moved too. Only the ones that
      // replaced something get a "was:" line under them, because only those
      // have something to say.
      if (!previousFacts.has(fact.key) || previousFacts.get(fact.key) !== fact.value) {
        changedKeys.add(fact.key);
      }
    }
    previousFacts = new Map((facts ?? []).map((fact) => [fact.key, fact.value]));
    return changedKeys.size;
  }

  /**
   * The same idea across two layers: a profile row and a working row can share
   * a key without being the same thing, so each one is diffed under its own
   * prefix. Promoting a decision lights up the profile row, not the task row
   * it came from.
   */
  function diffMemory(panel) {
    const rows = [
      ...(panel.profile ?? []).map((row) => ["profile:" + row.key, row.value]),
      ...(panel.task ?? []).map((row) => ["task:" + row.key, row.value]),
    ];
    changedKeys = new Set();
    for (const [key, value] of rows) {
      if (!previousFacts.has(key) || previousFacts.get(key) !== value) changedKeys.add(key);
    }
    previousFacts = new Map(rows);
    return changedKeys.size;
  }

  /** Light the panel up on the turn the model's memory of the past changed. */
  function flashPanel() {
    contextPanel.classList.add("flash");
    panelBadge.hidden = false;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => {
      contextPanel.classList.remove("flash");
      panelBadge.hidden = true;
    }, FLASH_MS);
  }

  function setPanelOpen(open) {
    contextPanel.dataset.open = String(open);
    panelToggle.setAttribute("aria-expanded", String(open));
    panelToggle.querySelector(".caret").textContent = open ? "▾" : "▸";
    try {
      localStorage.setItem(PANEL_OPEN_KEY, open ? "1" : "0");
    } catch (err) {
      // A browser that will not remember the preference still shows the panel.
    }
  }

  panelToggle.addEventListener("click", () => {
    setPanelOpen(contextPanel.dataset.open !== "true");
  });

  // ---- branches ------------------------------------------------------------

  const SVG = "http://www.w3.org/2000/svg";

  function svgEl(name, attrs) {
    const node = document.createElementNS(SVG, name);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    return node;
  }

  /**
   * A trunk with labelled offshoots. Deliberately not a real graph layout:
   * the useful information is "there are three of these and you are on the
   * second", and anything more elaborate would be a diagram of itself.
   */
  function renderBranchTree() {
    const rows = branches.length;
    const H = Math.max(18, rows * 14 + 6);
    const W = 74;
    branchTree.setAttribute("viewBox", `0 0 ${W} ${H}`);
    branchTree.setAttribute("width", String(W));
    branchTree.setAttribute("height", String(H));
    branchTree.innerHTML = "";

    branchTree.appendChild(
      svgEl("line", {
        x1: 8, y1: 4, x2: 8, y2: H - 4,
        stroke: "currentColor", "stroke-opacity": 0.3, "stroke-width": 1.5,
      })
    );

    branches.forEach((branch, index) => {
      const y = 10 + index * 14;
      const active = branch.id === branchId;
      if (index > 0) {
        branchTree.appendChild(
          svgEl("path", {
            d: `M8 ${y - 8} q0 8 10 8 h12`,
            fill: "none",
            stroke: active ? "var(--accent)" : "currentColor",
            "stroke-opacity": active ? 1 : 0.3,
          })
        );
      }
      branchTree.appendChild(
        svgEl("circle", {
          cx: index > 0 ? 30 : 8,
          cy: y,
          r: active ? 3.5 : 2.5,
          fill: active ? "var(--accent)" : "currentColor",
          "fill-opacity": active ? 1 : 0.35,
        })
      );
    });
  }

  function renderBranchBar() {
    branchBar.hidden = branches.length < 2 && !branches.some((b) => b.messageCount);
    branchSelect.innerHTML = "";
    for (const branch of branches) {
      const option = document.createElement("option");
      option.value = branch.id;
      option.textContent = `${branch.name} · ${branch.messageCount} msg`;
      branchSelect.appendChild(option);
    }
    branchSelect.value = branchId;

    const current = branches.find((b) => b.id === branchId);
    deleteBranchButton.disabled = branches.length < 2 || branchId === "main";
    branchNote.textContent = branches.length < 2
      ? "One line of conversation. Hover a message to fork it."
      : current?.forkedFromMessageId
        ? `forked from ${current.parentBranchId ?? "main"} · its own facts and summary`
        : `the trunk · ${branches.length} branches in total`;

    renderBranchTree();
  }

  async function forkFrom(messageId) {
    if (pending) return;
    const name = prompt("Name for the new branch?", "what if");
    if (name === null) return;

    try {
      const res = await fetch(`/conversations/${sessionId}/branches`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ fromMessageId: messageId, name: name.trim() }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) return alert(data.error ?? "Could not fork there.");
      branches = data.branches;
      await switchBranch(data.branch.id);
    } catch (err) {
      alert("Could not reach the server.");
    }
  }

  async function switchBranch(id) {
    try {
      const res = await fetch(`/conversations/${sessionId}/branches/${id}/activate` + pickerQuery(), {
        method: "POST",
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) return alert(data.error ?? "Could not switch branch.");
      branchId = id;
      branches = data.branches;
      // Each branch owns its own strategy state, so the panel has to be rebuilt
      // from that branch rather than carried across.
      previousFacts = new Map();
      changedKeys = new Set();
      await paintTranscript(sessionId);
      refreshUsage();
    } catch (err) {
      alert("Could not reach the server.");
    }
  }

  branchSelect.addEventListener("change", () => {
    if (branchSelect.value !== branchId) switchBranch(branchSelect.value);
  });

  deleteBranchButton.addEventListener("click", async () => {
    if (pending || !branchId || branchId === "main") return;
    const current = branches.find((b) => b.id === branchId);
    if (!confirm(`Delete the branch "${current?.name ?? branchId}" and everything only it can reach?`)) return;

    // Deleting the branch you are on is refused by the server, so step back to
    // the trunk first — which is also what you want to be looking at after.
    const target = branchId;
    await switchBranch("main");
    try {
      const res = await fetch(`/conversations/${sessionId}/branches/${target}`, { method: "DELETE" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) return alert(data.error ?? "Could not delete that branch.");
      branches = data.branches;
      renderBranchBar();
    } catch (err) {
      alert("Could not reach the server.");
    }
  });

  // ---- the context window --------------------------------------------------

  /**
   * Draw the line between what the model can still see and what it cannot —
   * and, at that line, what it has instead.
   *
   * The block is collapsible and holds whatever the strategy put in the system
   * prompt. Seeing the exact words the model is working from, at the point
   * where the verbatim messages stop, is the single most useful thing this UI
   * can show: it turns "the old turns are gone" into "the old turns are *this*".
   */
  function markContextBoundary(droppedCount) {
    const wasOpen = messages.querySelector("details.boundary")?.open ?? false;
    messages.querySelector("details.boundary")?.remove();
    for (const row of messages.querySelectorAll(".row.outside")) {
      row.classList.remove("outside");
    }
    if (!droppedCount) return;

    const rows = [...messages.querySelectorAll(".row")];
    if (droppedCount >= rows.length) return;

    for (let i = 0; i < droppedCount; i++) rows[i].classList.add("outside");

    const block = document.createElement("details");
    block.className = "boundary";
    block.open = wasOpen;

    const label = document.createElement("summary");
    label.textContent = boundaryLabel(droppedCount);

    const body = document.createElement("div");
    body.className = "summary-body";
    if (panelState.kind === "summary" && panelState.text) renderSummaryInto(body, panelState.text);
    else if (panelState.kind === "facts" && panelState.facts?.length) renderFactsInto(body, panelState.facts);
    else if (panelState.kind === "memory") renderMemoryInto(body, panelState, { interactive: false });
    else body.appendChild(panelPlaceholder());

    block.append(label, body);
    messages.insertBefore(block, rows[droppedCount]);
  }

  /**
   * A thin line in the transcript at every stage change, drawn **from the
   * log** rather than from anything the painter remembers.
   *
   * That is the whole reason the stage is derived from an append-only record
   * instead of being a field: reopening the conversation a week later puts the
   * dividers back in exactly the same places, for free, with nothing to
   * reconstruct and nothing to ask a model.
   */
  function markTransitions(life) {
    for (const old of messages.querySelectorAll(".stage-divider")) old.remove();
    if (!life?.log?.length) return;

    const userRows = [...messages.querySelectorAll(".row.user")];

    // Several clicks with nothing said between them all belong at the same
    // point in the transcript, and three lines stacked there read as nothing
    // having moved. Grouped, the run says what it actually was: you went to
    // execution, looked, went to validation, came back.
    for (const [turn, run] of groupBy(life.log, (entry) => entry.turn)) {
      const divider = document.createElement("div");
      divider.className = "stage-divider";
      divider.textContent =
        [run[0].from, ...run.map((entry) => entry.to)].join(" → ") +
        (run.every((entry) => entry.by === "user") ? "" : " · not all by you") +
        (run.at(-1).reason ? ` · ${run.at(-1).reason}` : "");
      divider.title = run
        .map((entry) => `${entry.from} → ${entry.to}${entry.at ? " · " + new Date(entry.at).toLocaleString() : ""}`)
        .join("\n");

      // The entries are stamped with the number of exchanges that had happened
      // when they were clicked, so the run belongs immediately before the next
      // message — or at the end, when nothing has been said since.
      const next = userRows[turn];
      if (next) messages.insertBefore(divider, next);
      else messages.appendChild(divider);
    }
  }

  /** `[[key, rows], …]`, keeping the order the rows came in. */
  function groupBy(rows, keyOf) {
    const groups = new Map();
    for (const row of rows ?? []) {
      const key = keyOf(row);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(row);
    }
    return groups;
  }

  /**
   * **"You were here."** Composed from state, with no model call.
   *
   * The stage says where the work is and `expectedAction` says what to do
   * about it, which between them is the whole of what a person needs after a
   * week away — and asking a model to reconstruct it would be paying for a
   * worse answer than the one already stored.
   */
  function resumeBanner(life) {
    if (!life?.log?.length || life.stage === "done") return;
    if (!messages.querySelector(".row")) return;

    const box = document.createElement("div");
    box.className = "resume";

    const head = document.createElement("b");
    head.textContent = `You were here — ${life.stage}`;
    box.append(head);
    if (life.updatedAt) box.append(` · last moved ${relativeTime(life.updatedAt)}`);
    if (life.step) box.append(document.createElement("br"), "in progress: " + life.step);

    const actor = life.expectedAction?.actor === "agent" ? "the agent" : "you";
    const what = document.createElement("span");
    what.className = "what";
    what.textContent =
      `next: ${actor}` + (life.expectedAction?.what ? ` — ${life.expectedAction.what}` : "");
    box.appendChild(what);

    messages.appendChild(box);
    messages.scrollTop = messages.scrollHeight;
  }

  function boundaryLabel(dropped) {
    if (panelState.kind === "memory") {
      const task = panelState.task?.length ?? 0;
      const stage = panelState.lifecycle?.stage;
      const brief = panelState.lifecycle?.brief;
      // Two different reasons a message stops being sent, and they should not
      // read alike: the digest is what happens to anything that scrolls past,
      // the brief is a handoff you read and approved.
      if (brief?.status === "accepted" && brief.through >= dropped) {
        return `⟵ ${dropped} planning messages replaced by the brief · ${task} in working memory · ${stage}`;
      }
      return `⟵ ${dropped} messages folded into the digest · ${task} kept in working memory` +
        (stage ? ` · ${stage}` : "");
    }
    if (panelState.kind === "summary" && panelState.text) {
      return `⟵ ${dropped} messages folded into the summary`;
    }
    if (panelState.kind === "facts") {
      const count = panelState.facts?.length ?? 0;
      return `⟵ ${dropped} messages out of the window · ${count} fact${count === 1 ? "" : "s"} kept from them`;
    }
    return `⟵ ${dropped} messages outside the window · nothing kept`;
  }

  /**
   * Name the zones of the payload, and say where the line between them falls.
   * "The last 5 messages" stopped being the whole story the moment something
   * started riding along with them.
   */
  function renderWindowBanner() {
    const { contextMessages, droppedCount, verbatimExchanges } = windowState;
    const id = strategySelect.value;
    windowText.innerHTML = "";

    const strong = document.createElement("strong");
    strong.textContent = "Sending: ";
    windowText.append(strong);

    if (id === "full") {
      windowText.append(
        `every message in this branch, ${windowState.storedMessages} of them, and nothing else. ` +
          "The input grows on every single turn, so the cost curve bends upward and never stops."
      );
      return;
    }

    if (id === "summary" && panelState.kind === "summary" && panelState.text) {
      const count = document.createElement("span");
      count.className = "dropped";
      count.textContent = `a summary of ${panelState.covers} earlier message${panelState.covers === 1 ? "" : "s"}`;
      windowText.append(count, ` + ${verbatimExchanges} exchange${verbatimExchanges === 1 ? "" : "s"} verbatim. `);
      windowText.append(
        "Full history is stored but not sent. " +
          `Once ${contextMessages} exchanges have piled up the oldest ${Math.max(1, Math.floor(contextMessages / 2))} are folded in, ` +
          "so every stored message is either in the summary or on the wire — never in neither."
      );
      return;
    }

    const view = panelView();
    if (id === "memory" && view.kind === "memory") {
      const count = document.createElement("span");
      count.className = "dropped";
      const profile = view.profile?.length ?? 0;
      const task = view.task?.length ?? 0;
      const stage = view.lifecycle?.stage;
      count.textContent =
        `${profile} profile entr${profile === 1 ? "y" : "ies"} + ${task} working entr${task === 1 ? "y" : "ies"}` +
        (stage ? ` in ${stage}` : "") +
        (view.digest?.text ? ` + a digest of ${view.digest.covers} earlier messages` : "");
      windowText.append(count, ` + ${verbatimExchanges} exchange${verbatimExchanges === 1 ? "" : "s"} verbatim. `);
      windowText.append(
