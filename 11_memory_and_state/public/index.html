        // that reply attributes its input to the blocks this turn sent, and
        // those numbers arrive with the panel.
        panelState = data.meta.strategy.panel ?? panelState;
        addMessage("agent", data.reply, { meta: data.meta, id: data.meta.branch.replyMessageId });

        windowState = { ...windowState, ...data.meta.window };
        lastSentTokens = data.meta.tokens?.sent ?? null;
        lastModel = data.meta.model ?? lastModel;
        branches = data.meta.branches ?? branches;
        strategyId = data.meta.strategy.id;

        const moved = panelState.kind === "facts"
          ? diffFacts(panelState.facts)
          : panelState.kind === "memory"
            ? diffMemory(panelState)
            : data.meta.strategy.overheadCalls && data.meta.strategy.note.startsWith("folded");
        renderPanel();
        renderBranchBar();
        if (moved) flashPanel();

        renderWindowBanner();
        markContextBoundary(windowState.droppedCount);
      }
    } catch (err) {
      thinking.remove();
      addMessage("agent", "Could not reach the server.", { error: true });
    } finally {
      setPending(false);
      input.focus();
      refreshConversations();
      refreshUsage();
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    send();
  });

  input.addEventListener("input", autoGrow);

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      send();
    }
  });

  // Resizing the window re-draws the banner immediately, before the next turn —
  // that is what makes the trade-off something you can play with.
  contextInput.addEventListener("change", () => {
    const value = Math.min(100, Math.max(2, Math.round(Number(contextInput.value) || 10)));
    contextInput.value = String(value);
    windowState.contextMessages = value;
    renderWindowBanner();
  });

  newButton.addEventListener("click", () => {
    // A new conversation is just a new id — the old one stays on the server,
    // reachable from the sidebar. Nothing is reset.
    switchTo(crypto.randomUUID());
    showEmptyState();
    resetPanel();
    renderPanel();
    renderBranchBar();
    refreshConversations();
    refreshUsage();
    input.focus();
  });

  function resetPanel() {
    panelState = { kind: "none", title: "", note: "" };
    previousFacts = new Map();
    changedKeys = new Set();
    lastPaintedStrategy = null;
    paintedTurns = 0;
    branches = [];
    branchId = null;
  }

  // ---- conversations -------------------------------------------------------

  function switchTo(id) {
    sessionId = id;
    localStorage.setItem(SESSION_KEY, id);
  }

  function relativeTime(iso) {
    const seconds = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (seconds < 60) return "just now";
    const units = [
      ["m", 60],
      ["h", 3600],
      ["d", 86400],
    ];
    let label = "m", size = 60;
    for (const [unitLabel, unitSize] of units) {
      if (seconds >= unitSize) { label = unitLabel; size = unitSize; }
    }
    return Math.floor(seconds / size) + label + " ago";
  }

  async function paintTranscript(id) {
    messages.innerHTML = "";
    lastPaintedStrategy = null;
    paintedTurns = 0;

    try {
      const res = await fetch("/conversations/" + id + branchQuery());
      if (!res.ok) {
        resetPanel();
        renderPanel();
        renderBranchBar();
        return showEmptyState();
      }

      const record = await res.json();
      branches = record.branches ?? [];
      branchId = record.branchId ?? "main";
      panelState = record.panel ?? { kind: "none", title: "", note: "" };
      // A repaint is not a change: the flash belongs to turns, not to reloads.
      previousFacts = new Map([
        ...(panelState.facts ?? []).map((fact) => [fact.key, fact.value]),
        ...(panelState.profile ?? []).map((row) => ["profile:" + row.key, row.value]),
        ...(panelState.task ?? []).map((row) => ["task:" + row.key, row.value]),
      ]);
      changedKeys = new Set();

      // The branch remembers which strategy it was last spoken to with, and
      // the selector follows it — reopening a conversation should not silently
      // switch how it is being managed.
      if (record.strategy) {
        strategyId = record.strategy;
        syncStrategySelect();
      }

      renderPanel();
      renderBranchBar();

      const turns = record.messages ?? [];
      if (!turns.length) return showEmptyState();
      for (const turn of turns) {
        // Stored messages carry the counts of the turn that produced them, so
        // a repainted transcript shows the same numbers it showed live.
        addMessage(turn.role === "user" ? "user" : "agent", turn.content, {
          meta: turn.tokens ? turn : null,
          id: turn.id,
        });
      }
    } catch (err) {
      resetPanel();
      renderPanel();
      renderBranchBar();
      showEmptyState();
    }
  }

  async function refreshConversations() {
    let list = [];
    try {
      const res = await fetch("/conversations");
      if (res.ok) list = await res.json();
    } catch (err) {
      // A sidebar we cannot fill is not worth failing the page over.
    }

    conversations.innerHTML = "";
    if (!list.length) {
      conversations.innerHTML = '<p class="empty">Nothing saved yet.</p>';
      return;
    }

    for (const item of list) {
      const row = document.createElement("div");
      row.className = "conversation" + (item.id === sessionId ? " active" : "");

      const text = document.createElement("div");
      text.className = "text";
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = item.title;
      const when = document.createElement("div");
      when.className = "when";
      when.textContent =
        relativeTime(item.updatedAt) +
        (item.branchCount > 1 ? ` · ${item.branchCount} branches` : "") +
        (item.totalCostUsd ? " · " + formatCost(item.totalCostUsd) : "");
      text.append(title, when);

      const remove = document.createElement("button");
      remove.className = "remove";
      remove.type = "button";
      remove.title = "Delete this conversation";
      remove.textContent = "×";

      row.append(text, remove);

      row.addEventListener("click", async () => {
        if (pending || item.id === sessionId) return;
        switchTo(item.id);
        resetPanel();
        await paintTranscript(item.id);
        refreshConversations();
        refreshUsage();
      });

      remove.addEventListener("click", async (event) => {
        event.stopPropagation();
        if (pending) return;
        try {
          await fetch("/conversations/" + item.id, { method: "DELETE" });
        } catch (err) {
          // Refreshing below will show whether it actually went away.
        }
        if (item.id === sessionId) {
          switchTo(crypto.randomUUID());
          resetPanel();
          showEmptyState();
        }
        refreshConversations();
        refreshUsage();
      });

      conversations.appendChild(row);
    }
  }

  let openByDefault = true;
  try {
    openByDefault = localStorage.getItem(PANEL_OPEN_KEY) !== "0";
  } catch (err) {
    // No stored preference is the same as not having expressed one.
  }
  setPanelOpen(openByDefault);
  await loadCatalog();
  renderPanel();
  renderWindowBanner();
  await paintTranscript(sessionId);
  refreshConversations();
  refreshUsage();
</script>
</body>
</html>
